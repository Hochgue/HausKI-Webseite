<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>HausKI CRM – Supabase clean</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{font-family:Arial,Helvetica,sans-serif;background:#eef2f6;margin:0;padding:20px}
.card{background:white;border:1px solid #d8e0e8;border-radius:8px;padding:16px;max-width:900px}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
button{padding:10px 14px;border:none;border-radius:4px;background:#5f7897;color:white;font-weight:bold;cursor:pointer}
button:hover{background:#6f87a3}
</style>

</head>
<body>

<div class="card">
<h2>HausKI CRM – Testversion Supabase</h2>

<div class="grid">
<div>
<label>Firma</label>
<input id="firma">
</div>

<div>
<label>Ort</label>
<input id="ort">
</div>

<div>
<label>PLZ</label>
<input id="plz">
</div>
</div>

<br>

<button onclick="saveContact()">Speichern</button>
<button onclick="loadContacts()">Laden</button>

<br><br>

<div id="status">Bereit</div>

<ul id="list"></ul>

</div>

<script>

const SUPABASE_URL = "https://wuizcshgkdolkngqoutj.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind1aXpjc2hna2RvbGtuZ3FvdXRqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM2ODE5OTgsImV4cCI6MjA4OTI1Nzk5OH0.C5SuBH9h1UQAUqOyZ7BYLqoRNR1QPOr0SXadeQJR1HM";

const supabase = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

async function saveContact(){

    const firma = document.getElementById("firma").value;
    const ort = document.getElementById("ort").value;
    const plz = document.getElementById("plz").value;

    document.getElementById("status").innerText = "Speichern ...";

    const { data, error } = await supabase
        .from("crm_firmen")
        .insert([
            {
                firma: firma,
                ort: ort,
                plz: plz
            }
        ]);

    if(error){

        console.log(error);
        document.getElementById("status").innerText =
            "Fehler beim Speichern";

        alert("Speichern fehlgeschlagen");

        return;

    }

    document.getElementById("status").innerText =
        "Gespeichert";

    alert("Kontakt gespeichert");

    loadContacts();

}

async function loadContacts(){

    const { data, error } = await supabase
        .from("crm_firmen")
        .select("*")
        .order("firma");

    if(error){

        console.log(error);
        return;

    }

    const list =
        document.getElementById("list");

    list.innerHTML = "";

    data.forEach(row => {

        const li =
            document.createElement("li");

        li.innerText =
            row.firma +
            " – " +
            row.plz +
            " " +
            row.ort;

        list.appendChild(li);

    });

}

loadContacts();

</script>

</body>
</html>
