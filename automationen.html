<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL = 'https://wuizcshgkdolkngqoutj.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_hHr-ZsPbx8vFZfOJ-mGARg_Atr7yIdI';

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);

async function loadAutomationen() {

  const { data, error } = await supabaseClient
    .from('posts')
    .select('*')
    .eq('published', true)
    .eq('type', 'Automation')
    .order('date', { ascending: false });

  if (error) {
    console.error(error);
    alert(error.message);
    return;
  }

  renderAutomationen(data || []);
}

function renderAutomationen(posts) {

  const grid = document.getElementById("autoGrid");

  if (!posts.length) {

    grid.innerHTML = `
      <div class="empty-text">
        Noch keine Automationen vorhanden.
      </div>
    `;

    return;
  }

  grid.innerHTML = posts.map(post => {

    return `
      <a class="automation-card"
         href="blog.html#post-${post.id}">

        <div class="auto-image"
             style="background-image:url('${post.image}')">
        </div>

        <div class="auto-body">

          <div>

            <span class="badge">
              ${post.category || "Automation"}
            </span>

            <h3>
              ${post.title}
            </h3>

            <p>
              ${post.excerpt || ""}
            </p>

          </div>

          <div class="linkline">
            Automation ansehen →
          </div>

        </div>

      </a>
    `;

  }).join("");

}

loadAutomationen();

</script>
