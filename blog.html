<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HausKI – Blog</title>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<style>

body{
  font-family:Arial;
  background:#040911;
  color:white;
  margin:0;
}

h1{
  padding:20px;
}

.posts-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px;
  padding:20px;
}

.card{
  background:#0a1320;
  padding:20px;
  border-radius:12px;
}

.button{
  display:inline-block;
  padding:10px 14px;
  background:#21c8ff;
  color:black;
  text-decoration:none;
  border-radius:8px;
  margin-top:12px;
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.8);
  display:none;
  align-items:center;
  justify-content:center;
}

.modal.open{
  display:flex;
}

.modal-card{
  background:#0a1320;
  padding:30px;
  border-radius:12px;
  max-width:900px;
  width:90%;
}

.close{
  cursor:pointer;
  margin-top:20px;
  display:inline-block;
}

@media(max-width:900px){
  .posts-grid{
    grid-template-columns:1fr;
  }
}

</style>
</head>

<body>

<h1>HausKI Blog</h1>

<div id="postsGrid" class="posts-grid"></div>

<div id="modal" class="modal">
  <div class="modal-card">

    <h2 id="modalTitle"></h2>

    <p id="modalContent"></p>

    <span class="button close" onclick="closeModal()">
      Schließen
    </span>

  </div>
</div>

<script>

const SUPABASE_URL =
'https://wuizcshgkdolkngqoutj.supabase.co';

const SUPABASE_ANON_KEY =
'sb_publishable_hHr-ZsPbx8vFZfOJ-mGARg_Atr7yIdI';

const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);

let posts = [];

function escapeHtml(text){

  return String(text || "")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;");

}

async function loadPosts(){

  const { data, error } =
  await supabaseClient
    .from("posts")
    .select("*")
    .eq("published", true)
    .neq("type", "Automation")
    .order("date", { ascending:false });

  if(error){

    console.error(error);
    alert(error.message);
    return;

  }

  posts = data || [];

  renderPosts(posts);

  openPostFromUrl();

}

function renderPosts(posts){

  const grid =
  document.getElementById("postsGrid");

  if(!posts.length){

    grid.innerHTML =
    "Keine Blogbeiträge gefunden";

    return;

  }

  grid.innerHTML =
  posts.map(post => `

    <div class="card">

      <h3>
        ${escapeHtml(post.title)}
      </h3>

      <p>
        ${escapeHtml(post.excerpt || "")}
      </p>

      <a
        class="button"
        href="#post-${post.id}"
        onclick="
          event.preventDefault();
          openPost('${post.id}')
        "
      >
        Beitrag öffnen
      </a>

    </div>

  `).join("");

}

function openPost(postId){

  const post =
  posts.find(
    p => String(p.id)
    === String(postId)
  );

  if(!post) return;

  document
    .getElementById("modalTitle")
    .innerHTML =
    escapeHtml(post.title);

  document
    .getElementById("modalContent")
    .innerHTML =
    escapeHtml(
      post.content
      || post.excerpt
    );

  document
    .getElementById("modal")
    .classList
    .add("open");

  history.pushState(
    null,
    "",
    "#post-" + postId
  );

}

function closeModal(){

  document
    .getElementById("modal")
    .classList
    .remove("open");

  history.pushState(
    null,
    "",
    window.location.pathname
  );

}

function openPostFromUrl(){

  const hash =
  window.location.hash;

  if(!hash.startsWith("#post-"))
    return;

  const postId =
  hash.replace("#post-","");

  openPost(postId);

}

window.addEventListener(
  "hashchange",
  openPostFromUrl
);

loadPosts();

</script>

</body>
</html>
