<script>
const SUPABASE_URL = 'https://wuizcshgkdolkngqoutj.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_hHr-ZsPbx8vFZfOJ-mGARg_Atr7yIdI';

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);

async function loadPosts() {

  const { data, error } = await supabaseClient
    .from('posts')
    .select('*')
    .eq('published', true)
    .neq('type', 'Automation')
    .order('date', { ascending: false });

  if (error) {
    console.error(error);
    alert(error.message);
    return;
  }

  renderPosts(data || []);
}

function renderPosts(posts) {

  const grid = document.getElementById("postsGrid");

  if (!posts.length) {
    grid.innerHTML = `
      <div class="empty-text">
        Noch keine Blogbeiträge vorhanden.
      </div>
    `;
    return;
  }

  grid.innerHTML = posts.map(post => {

    return `
      <article class="card">

        <div class="card-image-wrap">
          ${post.image
            ? `<img class="card-image" src="${post.image}">`
            : `<div class="card-image placeholder">HausKI</div>`
          }
        </div>

        <div class="card-body">

          <div class="meta-row">
            <span>${post.category || "Allgemein"}</span>
            <span>${post.date || ""}</span>
          </div>

          <h3>${post.title}</h3>

          <p class="excerpt">
            ${post.excerpt || ""}
          </p>

          <div class="card-actions">
            <a class="button-outline"
               href="#post-${post.id}"
               onclick="event.preventDefault(); openPost('${post.id}')">
               Beitrag lesen
            </a>
          </div>

        </div>

      </article>
    `;

  }).join("");

}

loadPosts();
</script>
