<!DOCTYPE html>
<html lang="de">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HausKI – Blog</title>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<style>

body{
  margin:0;
  font-family:Arial, Helvetica, sans-serif;
  background:#040911;
  color:white;
}

h1{
  padding:20px;
}

.posts-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px;
  padding:20px;
}

.card{
  background:#0a1320;
  padding:20px;
  border-radius:12px;
}

.card h3{
  margin-top:0;
}

.button{
  display:inline-block;
  padding:10px 14px;
  background:#21c8ff;
  color:black;
  text-decoration:none;
  border-radius:8px;
  margin-top:12px;
}

.empty{
  padding:20px;
}

@media(max-width:900px){

  .posts-grid{
    grid-template-columns:1fr;
  }

}

</style>

</head>

<body>

<h1>HausKI Blog</h1>

<div
  id="postsGrid"
  class="posts-grid">
</div>

<script>

const SUPABASE_URL =
'https://wuizcshgkdolkngqoutj.supabase.co';

const SUPABASE_ANON_KEY =
'sb_publishable_hHr-ZsPbx8vFZfOJ-mGARg_Atr7yIdI';

const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);

async function loadPosts(){

  const { data, error } =
  await supabaseClient
    .from("posts")
    .select("*")
    .eq("published", true)
    .neq("type", "Automation")
    .order("date", { ascending:false });

  if(error){

    console.error(error);

    alert(error.message);

    return;

  }

  renderPosts(data || []);

}

function renderPosts(posts){

  const grid =
  document.getElementById("postsGrid");

  if(!posts.length){

    grid.innerHTML =
    "<div class='empty'>Keine Blogbeiträge gefunden</div>";

    return;

  }

  grid.innerHTML =
  posts.map(post => `

    <div class="card">

      <h3>
        ${post.title}
      </h3>

      <p>
        ${post.excerpt || ""}
      </p>

      <a
        class="button"
        href="blog.html#post-${post.id}">
        Beitrag öffnen
      </a>

    </div>

  `).join("");

}

loadPosts();

</script>

</body>
</html>
