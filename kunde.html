<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kundenakte</title>

<style>
:root{
  --bg:#edf2f7;
  --panel:#ffffff;
  --line:#d8e1ea;
  --text:#1e293b;
  --muted:#64748b;
  --blue:#4f6b8a;
  --blue-hover:#5f7897;
  --green:#16a34a;
  --orange:#f59e0b;
  --red:#dc2626;
  --shadow:0 10px 25px rgba(15,23,42,.08);
  --radius:16px;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:Inter,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
}

.page{
  max-width:1500px;
  margin:auto;
  padding:24px;
}

.header{
  background:white;
  border:1px solid var(--line);
  border-radius:20px;
  padding:22px;
  box-shadow:var(--shadow);
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px;
  margin-bottom:20px;
}

.customer-title{
  font-size:32px;
  font-weight:800;
}

.customer-meta{
  color:var(--muted);
  margin-top:6px;
}

.header-actions{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

button{
  border:none;
  border-radius:12px;
  padding:11px 16px;
  cursor:pointer;
  font-weight:700;
  background:var(--blue);
  color:white;
}

button:hover{background:var(--blue-hover)}
button.green{background:var(--green)}
button.orange{background:var(--orange)}
button.red{background:var(--red)}
button.light{background:#e2e8f0;color:#1e293b}

.tabs{
  display:flex;
  gap:10px;
  margin-bottom:20px;
  flex-wrap:wrap;
}

.tab{
  padding:12px 18px;
  border-radius:12px;
  background:white;
  border:1px solid var(--line);
  cursor:pointer;
  font-weight:700;
}

.tab.active{
  background:var(--blue);
  color:white;
}

.card{
  background:white;
  border:1px solid var(--line);
  border-radius:20px;
  padding:22px;
  box-shadow:var(--shadow);
  margin-bottom:20px;
}

.card-title{
  font-size:24px;
  font-weight:800;
  margin-bottom:20px;
}

.grid2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
}

.grid3{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:16px;
}

.full{grid-column:1/-1}

label{
  display:block;
  font-size:13px;
  font-weight:700;
  margin-bottom:6px;
  color:var(--muted);
}

input,select,textarea{
  width:100%;
  border:1px solid #cbd5e1;
  border-radius:12px;
  padding:12px;
  font-size:14px;
  background:white;
}

textarea{
  min-height:130px;
  resize:vertical;
}

.timeline-item{
  background:#f8fafc;
  border:1px solid var(--line);
  border-radius:14px;
  padding:16px;
  margin-bottom:14px;
}

.timeline-date{
  font-weight:800;
  margin-bottom:8px;
}

.timeline-type{
  color:var(--muted);
  font-size:13px;
  margin-bottom:10px;
}

.file-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:#f8fafc;
  border:1px solid var(--line);
  border-radius:14px;
  padding:14px;
  margin-bottom:12px;
}

.ai-box{
  background:#f8fafc;
  border:1px solid var(--line);
  border-radius:14px;
  padding:16px;
  line-height:1.5;
}

@media(max-width:1000px){
  .grid2,.grid3{grid-template-columns:1fr}
  .header{display:block}
  .header-actions{margin-top:20px}
}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

<div class="page">

  <div class="header">
    <div>
      <div class="customer-title" id="headerFirma">Kunde</div>
      <div class="customer-meta" id="headerMeta">-</div>
    </div>

    <div class="header-actions">
      <button class="light" onclick="window.location.href='crm-v3.html'">Zurück</button>
      <button class="orange">Termin</button>
      <button class="green" onclick="saveCustomer()">Speichern</button>
    </div>
  </div>

  <div class="tabs">
    <div class="tab active" onclick="showTab('overview',this)">Übersicht</div> 
    <div class="tab" onclick="showTab('activity',this)">Aktivität</div>
    <div class="tab" onclick="showTab('timeline',this)">Timeline</div>
    <div class="tab" onclick="showTab('files',this)">Anhänge</div>
    <div class="tab" onclick="showTab('ai',this)">KI Insights</div>
  </div>

  <div class="card tab-content" id="overview">
    <div class="card-title">Kundenakte</div>

    <div class="grid2">
      <div class="full">
        <label>Firma</label>
        <input id="firma">
      </div>

      <div>
        <label>Ansprechpartner</label>
        <input id="ansprechpartner">
      </div>

      <div>
        <label>E-Mail</label>
        <input id="email">
      </div>

      <div>
        <label>Telefon</label>
        <input id="telefon">
      </div>

      <div>
        <label>Mobil</label>
        <input id="mobil">
      </div>

      <div>
        <label>Straße</label>
        <input id="strasse">
      </div>

      <div>
        <label>PLZ</label>
        <input id="plz">
      </div>

      <div>
        <label>Ort</label>
        <input id="ort">
      </div>

      <div>
        <label>Bezirk</label>
        <input id="bezirk">
      </div>

      <div>
        <label>Bundesland</label>
        <input id="bundesland">
      </div>

      <div>
        <label>Kundentyp</label>
        <select id="kundentyp">
          <option></option>
          <option>Fachpartner</option>
          <option>B2B</option>
          <option>Privat</option>
          <option>Sonstiges</option>
        </select>
      </div>

      <div>
        <label>Kundenstatus</label>
        <select id="kundenstatus">
          <option></option>
          <option>Lead</option>
          <option>Interessent</option>
          <option>Kunde</option>
          <option>Kein Interesse</option>
          <option>In weclapp</option>
        </select>
      </div>

      <div>
        <label>Status</label>
        <select id="status">
          <option></option>
          <option>Termin vereinbart</option>
          <option>Unterlagen versendet</option>
          <option>Nachfassen</option>
          <option>Kein Interesse</option>
          <option>In weclapp</option>
        </select>
      </div>

      <div>
        <label>Chance</label>
        <select id="chance">
          <option></option>
          <option>Sehr hoch</option>
          <option>Hoch</option>
          <option>Mittel</option>
          <option>Gering</option>
        </select>
      </div>

      <div>
        <label>Leadquelle</label>
        <input id="leadquelle">
      </div>

      <div class="full">
        <label>Notiz</label>
        <textarea id="notiz"></textarea>
      </div>
    </div>
  </div>

  <div class="card tab-content" id="activity" style="display:none;">
    <div class="card-title">Neue Aktivität</div>

    <div class="grid3">
      <div>
        <label>Datum</label>
        <input id="activityDate" type="date">
      </div>

      <div>
        <label>Uhrzeit</label>
        <input id="activityTime" type="time">
      </div>

      <div>
        <label>Typ</label>
        <select id="activityType">
          <option>Telefonat geführt</option>
          <option>Mail gesendet</option>
          <option>Persönlicher Besuch</option>
          <option>Teams Call</option>
          <option>Unterlagen gesendet</option>
          <option>Angebot erstellt</option>
          <option>Erstkontakt</option>
          <option>Sonstiges</option>
        </select>
      </div>
    </div>

    <div style="margin-top:18px;">
      <label>Notiz</label>
      <textarea id="activityNote" placeholder="Aktivität eintragen..."></textarea>
    </div>

    <div style="margin-top:20px;">
      <button class="green" onclick="saveActivity()">Aktivität speichern</button>
    </div>
  </div>

  <div class="card tab-content" id="timeline" style="display:none;">
    <div class="card-title">Timeline</div>
    <div id="timelineList"></div>
  </div>

  <div class="card tab-content" id="files" style="display:none;">
    <div class="card-title">Anhänge</div>
    <div id="filesList"></div>
  </div>

  <div class="card tab-content" id="ai" style="display:none;">
    <div class="card-title">KI Insights</div>

    <div class="ai-box" id="aiBox">
      -
    </div>
  </div>

</div>

<script>
const SUPABASE_URL = "https://wuizcshgkdolkngqoutj.supabase.co";

const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind1aXpjc2hna2RvbGtuZ3FvdXRqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM2ODE5OTgsImV4cCI6MjA4OTI1Nzk5OH0.C5SuBH9h1UQAUqOyZ7BYLqoRNR1QPOr0SXadeQJR1HM";

const supabaseClient =
  supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let crmContacts =
  JSON.parse(localStorage.getItem("crmContacts") || "[]");

const params =
  new URLSearchParams(window.location.search);

const customerId =
  Number(params.get("id"));

let customer =
  crmContacts.find(c => Number(c.id) === customerId);

let supabaseFirmaId = null;

if(!customer){
  alert("Kunde nicht gefunden");
  window.location.href = "crm-v3.html";
}

function setValue(id,value){
  document.getElementById(id).value = value || "";
}

function getValue(id){
  return document.getElementById(id).value.trim();
}

async function findSupabaseFirmaId(){

  if(customer.firma_id){
    supabaseFirmaId = customer.firma_id;
    return;
  }

  if(!customer.firma){
    return;
  }

  const { data, error } = await supabaseClient
    .from("crm_firmen")
    .select("id,firma")
    .ilike("firma", `%${customer.firma}%`)
    .limit(1);

  if(error){
    console.error("Fehler Firma suchen:", error);
    return;
  }

  if(data && data.length > 0){
    supabaseFirmaId = data[0].id;
  }
}

async function loadCustomer(){

  document.getElementById("headerFirma").innerText =
    customer.firma || "Unbekannter Kunde";

  document.getElementById("headerMeta").innerText =
    `${customer.ort || "-"} · ${customer.kundentyp || "-"} · ${customer.chance || "-"}`;

  setValue("firma", customer.firma);
  setValue("ansprechpartner", customer.ansprechpartner);
  setValue("email", customer.email);
  setValue("telefon", customer.telefon);
  setValue("mobil", customer.mobil);
  setValue("strasse", customer.strasse);
  setValue("plz", customer.plz);
  setValue("ort", customer.ort);
  setValue("bezirk", customer.bezirk);
  setValue("bundesland", customer.bundesland);
  setValue("kundentyp", customer.kundentyp);
  setValue("kundenstatus", customer.kundenstatus);
  setValue("status", customer.status);
  setValue("chance", customer.chance);
  setValue("leadquelle", customer.leadquelle);
  setValue("notiz", customer.notiz);

  await findSupabaseFirmaId();

  renderTimeline();
  await loadSupabaseHistory();
  await loadSupabaseFiles();
  renderAI();
}

function saveCustomer(){

  customer.firma = getValue("firma");
  customer.ansprechpartner = getValue("ansprechpartner");
  customer.email = getValue("email");
  customer.telefon = getValue("telefon");
  customer.mobil = getValue("mobil");
  customer.strasse = getValue("strasse");
  customer.plz = getValue("plz");
  customer.ort = getValue("ort");
  customer.bezirk = getValue("bezirk");
  customer.bundesland = getValue("bundesland");
  customer.kundentyp = getValue("kundentyp");
  customer.kundenstatus = getValue("kundenstatus");
  customer.status = getValue("status");
  customer.chance = getValue("chance");
  customer.leadquelle = getValue("leadquelle");
  customer.notiz = getValue("notiz");

  localStorage.setItem("crmContacts", JSON.stringify(crmContacts));

  alert("Kunde gespeichert");
  loadCustomer();
}

function saveActivity(){

  if(!customer.activities){
    customer.activities = [];
  }

  const activity = {
    date: getValue("activityDate"),
    time: getValue("activityTime"),
    type: getValue("activityType"),
    note: getValue("activityNote"),
    created: new Date().toISOString()
  };

  if(!activity.note){
    alert("Bitte Notiz eintragen");
    return;
  }

  customer.activities.unshift(activity);

  localStorage.setItem("crmContacts", JSON.stringify(crmContacts));

  document.getElementById("activityNote").value = "";

  alert("Aktivität gespeichert");

  renderTimeline();
  loadSupabaseHistory();
  showTab("timeline", document.querySelectorAll(".tab")[2]);
}

function renderTimeline(){

  const list =
    document.getElementById("timelineList");

  list.innerHTML = "";

  let hasContent = false;

  if(customer.aktivitaeten_alt){
    const div = document.createElement("div");
    div.className = "timeline-item";

    div.innerHTML = `
      <div class="timeline-date">Importierte Aktivitäten</div>
      <div class="timeline-type">CSV Import</div>
      <div>${customer.aktivitaeten_alt}</div>
    `;

    list.appendChild(div);
    hasContent = true;
  }

  if(customer.mails_alt){
    const div = document.createElement("div");
    div.className = "timeline-item";

    div.innerHTML = `
      <div class="timeline-date">Importierte Mails</div>
      <div class="timeline-type">CSV Import</div>
      <div>${customer.mails_alt}</div>
    `;

    list.appendChild(div);
    hasContent = true;
  }

  const activities =
    customer.activities || [];

  activities.forEach(a => {
    const div = document.createElement("div");
    div.className = "timeline-item";

    div.innerHTML = `
      <div class="timeline-date">${a.date || "-"} · ${a.time || ""}</div>
      <div class="timeline-type">${a.type || "-"}</div>
      <div>${a.note || ""}</div>
    `;

    list.appendChild(div);
    hasContent = true;
  });

  if(!hasContent){
    list.innerHTML =
      "<p style='color:var(--muted);'>Noch keine lokalen Aktivitäten vorhanden.</p>";
  }
}

async function loadSupabaseHistory(){

  const list =
    document.getElementById("timelineList");

  if(!list) return;

  if(!supabaseFirmaId){
    const div = document.createElement("div");
    div.className = "timeline-item";
    div.innerHTML = `
      <div class="timeline-date">Supabase</div>
      <div class="timeline-type">Keine Verknüpfung gefunden</div>
      <div>Für diese Firma wurde keine passende Supabase-ID gefunden.</div>
    `;
    list.appendChild(div);
    return;
  }

  const { data, error } = await supabaseClient
  .from("crm_historie")
  .select("*")
  .eq("firma_id", supabaseFirmaId)
  .order("datum", { ascending: false });
  if(error){
    console.error("Fehler Supabase Historie:", error);
    return;
  }

  if(!data || data.length === 0){
    const div = document.createElement("div");
    div.className = "timeline-item";
    div.innerHTML = `
      <div class="timeline-date">Supabase</div>
      <div class="timeline-type">Keine Historie</div>
      <div>Keine Einträge in crm_historie gefunden.</div>
    `;
    list.appendChild(div);
    return;
  }

  data.forEach(entry => {
    const div =
      document.createElement("div");

    div.className = "timeline-item";

    div.innerHTML = `
      <div class="timeline-date">
        ${entry.datum || "-"}
      </div>

      <div class="timeline-type">
        ${entry.art || "-"}
      </div>

      <div>
        ${entry.notiz || ""}
      </div>
    `;

    list.appendChild(div);
  });
}

async function loadSupabaseFiles(){

  const list =
    document.getElementById("filesList");

  if(!list) return;

  if(!supabaseFirmaId){
    list.innerHTML =
      "<p style='color:var(--muted);'>Keine Supabase-Verknüpfung gefunden.</p>";
    return;
  }

  const { data, error } = await supabaseClient
    .from("crm_anhaenge")
    .select("*")
    .eq("firma_id", supabaseFirmaId)
    .order("created_at", { ascending: false });

  if(error){
    console.error("Fehler Supabase Anhänge:", error);
    list.innerHTML =
      "<p style='color:var(--muted);'>Fehler beim Laden der Anhänge.</p>";
    return;
  }

  if(!data || data.length === 0){
    list.innerHTML =
      "<p style='color:var(--muted);'>Keine Anhänge gefunden.</p>";
    return;
  }

  list.innerHTML = "";

  data.forEach(file => {
    const div = document.createElement("div");
    div.className = "file-row";

    div.innerHTML = `
      <div>
        <strong>${file.filename || file.dateiname || "Anhang"}</strong><br>
        <small>${file.created_at || ""}</small><br>
        <small>${file.dateipfad || ""}</small>
      </div>
    `;

    list.appendChild(div);
  });
}

function renderAI(){

  let text = "Keine Empfehlung vorhanden.";

  if((customer.chance || "").toLowerCase().includes("hoch")){
    text = "Hohe Abschlusschance. Innerhalb von 5–7 Tagen aktiv nachfassen.";
  }

  if((customer.status || "").toLowerCase().includes("termin")){
    text = "Termin vorhanden. Gespräch vorbereiten, Bedarf klären und nächsten Schritt festlegen.";
  }

  if((customer.status || "").toLowerCase().includes("unterlagen")){
    text = "Unterlagen wurden versendet. Nach 3–5 Tagen telefonisch nachfassen.";
  }

  document.getElementById("aiBox").innerHTML =
    "<strong>Empfehlung:</strong><br>" + text;
}

function showTab(tabId, element){

  document.querySelectorAll(".tab-content").forEach(tab=>{
    tab.style.display = "none";
  });

  document.querySelectorAll(".tab").forEach(tab=>{
    tab.classList.remove("active");
  });

  document.getElementById(tabId).style.display = "block";
  element.classList.add("active");
}

loadCustomer();
</script>

</body>
</html>
