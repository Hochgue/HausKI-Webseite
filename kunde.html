<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kundenakte</title>

<style>

:root{
  --bg:#edf2f7;
  --panel:#ffffff;
  --line:#d8e1ea;
  --text:#1e293b;
  --muted:#64748b;

  --blue:#4f6b8a;
  --blue-hover:#5f7897;

  --green:#16a34a;
  --orange:#f59e0b;
  --red:#dc2626;

  --shadow:0 10px 25px rgba(15,23,42,.08);
  --radius:16px;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Inter,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
}

.page{
  max-width:1500px;
  margin:auto;
  padding:24px;
}

/* =========================
   HEADER
========================= */

.header{
  background:white;
  border:1px solid var(--line);
  border-radius:20px;
  padding:22px;
  box-shadow:var(--shadow);

  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px;

  margin-bottom:20px;
}

.customer-title{
  font-size:32px;
  font-weight:800;
}

.customer-meta{
  color:var(--muted);
  margin-top:6px;
}

.header-actions{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

/* =========================
   BUTTONS
========================= */

button{
  border:none;
  border-radius:12px;
  padding:11px 16px;
  cursor:pointer;
  font-weight:700;
  background:var(--blue);
  color:white;
}

button:hover{
  background:var(--blue-hover);
}

button.green{
  background:var(--green);
}

button.orange{
  background:var(--orange);
}

button.red{
  background:var(--red);
}

button.light{
  background:#e2e8f0;
  color:#1e293b;
}

/* =========================
   TABS
========================= */

.tabs{
  display:flex;
  gap:10px;
  margin-bottom:20px;
  flex-wrap:wrap;
}

.tab{
  padding:12px 18px;
  border-radius:12px;
  background:white;
  border:1px solid var(--line);
  cursor:pointer;
  font-weight:700;
}

.tab.active{
  background:var(--blue);
  color:white;
}

/* =========================
   CONTENT
========================= */

.card{
  background:white;
  border:1px solid var(--line);
  border-radius:20px;
  padding:22px;
  box-shadow:var(--shadow);
  margin-bottom:20px;
}

.card-title{
  font-size:24px;
  font-weight:800;
  margin-bottom:20px;
}

.grid2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
}

.grid3{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:16px;
}

.full{
  grid-column:1/-1;
}

/* =========================
   INPUTS
========================= */

label{
  display:block;
  font-size:13px;
  font-weight:700;
  margin-bottom:6px;
  color:var(--muted);
}

input,
select,
textarea{
  width:100%;
  border:1px solid #cbd5e1;
  border-radius:12px;
  padding:12px;
  font-size:14px;
  background:white;
}

textarea{
  min-height:130px;
  resize:vertical;
}

/* =========================
   TIMELINE
========================= */

.timeline-item{
  background:#f8fafc;
  border:1px solid var(--line);
  border-radius:14px;
  padding:16px;
  margin-bottom:14px;
}

.timeline-date{
  font-weight:800;
  margin-bottom:8px;
}

.timeline-type{
  color:var(--muted);
  font-size:13px;
  margin-bottom:10px;
}

/* =========================
   FILES
========================= */

.file-row{
  display:flex;
  justify-content:space-between;
  align-items:center;

  background:#f8fafc;
  border:1px solid var(--line);
  border-radius:14px;

  padding:14px;
  margin-bottom:12px;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:1000px){

  .grid2,
  .grid3{
    grid-template-columns:1fr;
  }

  .header{
    display:block;
  }

  .header-actions{
    margin-top:20px;
  }

}

</style>
</head>

<body>

<div class="page">

  <!-- HEADER -->

  <div class="header">

    <div>
      <div class="customer-title">
        Musterkunde GmbH
      </div>

      <div class="customer-meta">
        Linz · Fachpartner · Hohe Chance
      </div>
    </div>

    <div class="header-actions">
      <button class="light">
        Zurück
      </button>

      <button class="orange">
        Termin
      </button>

      <button class="green">
        Speichern
      </button>
    </div>

  </div>

  <!-- TABS -->

  <div class="tabs">

    <div class="tab active">
      Übersicht
    </div>

    <div class="tab">
      Aktivität
    </div>

    <div class="tab">
      Timeline
    </div>

    <div class="tab">
      Anhänge
    </div>

    <div class="tab">
      KI Insights
    </div>

  </div>

  <!-- ÜBERSICHT -->

  <div class="card">

    <div class="card-title">
      Kundenakte
    </div>

    <div class="grid2">

      <div class="full">
        <label>Firma</label>
        <input value="Musterkunde GmbH">
      </div>

      <div>
        <label>Straße</label>
        <input value="Musterstraße 1">
      </div>

      <div>
        <label>PLZ / Ort</label>
        <input value="4020 Linz">
      </div>

      <div>
        <label>Kundentyp</label>

        <select>
          <option>Fachpartner</option>
        </select>
      </div>

      <div>
        <label>Kundenstatus</label>

        <select>
          <option>Termin vereinbart</option>
        </select>
      </div>

      <div>
        <label>Potenzial</label>

        <select>
          <option>groß</option>
        </select>
      </div>

      <div>
        <label>Chance</label>

        <select>
          <option>Hoch</option>
        </select>
      </div>

    </div>

  </div>

  <!-- AKTIVITÄT -->

  <div class="card">

    <div class="card-title">
      Neue Aktivität
    </div>

    <div class="grid3">

      <div>
        <label>Datum</label>
        <input type="date">
      </div>

      <div>
        <label>Uhrzeit</label>
        <input type="time">
      </div>

      <div>
        <label>Typ</label>

        <select>
          <option>Telefonat</option>
          <option>Mail</option>
          <option>Termin</option>
        </select>
      </div>

    </div>

    <div style="margin-top:18px;">
      <label>Notiz</label>

      <textarea placeholder="Aktivität eintragen..."></textarea>
    </div>

    <div style="margin-top:20px;">
      <button class="green">
        Aktivität speichern
      </button>
    </div>

  </div>

  <!-- TIMELINE -->

  <div class="card">

    <div class="card-title">
      Timeline
    </div>

    <div class="timeline-item">

      <div class="timeline-date">
        07.05.2026 · 10:30
      </div>

      <div class="timeline-type">
        Telefonat geführt
      </div>

      <div>
        Kunde interessiert sich für FENECON Home.
        Preise senden.
      </div>

    </div>

  </div>

  <!-- DATEIEN -->

  <div class="card">

    <div class="card-title">
      Anhänge
    </div>

    <div class="file-row">

      <div>
        <strong>Angebot.pdf</strong><br>
        <small>1.2 MB</small>
      </div>

      <button class="light">
        Öffnen
      </button>

    </div>

  </div>

</div>

</body>
</html>
