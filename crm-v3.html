<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRM v4 Hybrid</title>

<style>
:root{
  --bg:#e9eef5;
  --sidebar:#0f172a;
  --sidebar-light:#1e293b;
  --panel:#ffffff;
  --panel-soft:#f8fafc;
  --line:#d8e1ea;
  --text:#1e293b;
  --muted:#64748b;
  --blue:#4f6b8a;
  --blue-hover:#5f7897;
  --green:#16a34a;
  --orange:#f59e0b;
  --red:#dc2626;
  --shadow:0 10px 25px rgba(15,23,42,.08);
  --radius:16px;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:Inter,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  height:100vh;
  overflow:hidden;
}

#app{
  display:grid;
  grid-template-columns:320px 1fr 360px;
  height:100vh;
}

.sidebar{
  background:linear-gradient(180deg,var(--sidebar),#162235);
  color:white;
  border-right:1px solid rgba(255,255,255,.05);
  padding:18px;
  overflow-y:auto;
}

.sidebar h1{
  margin-top:0;
  font-size:24px;
}

.sidebar-section{
  margin-top:24px;
}

.sidebar-title{
  font-size:12px;
  text-transform:uppercase;
  letter-spacing:.08em;
  color:#94a3b8;
  margin-bottom:10px;
}

.main{
  padding:22px;
  overflow-y:auto;
}

.panel{
  background:#f4f7fb;
  border-left:1px solid var(--line);
  padding:18px;
  overflow-y:auto;
}

.card,.panel-box{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:18px;
  margin-bottom:18px;
  box-shadow:var(--shadow);
}

.panel-box{
  border-radius:14px;
  padding:14px;
}

.card-title{
  font-size:22px;
  font-weight:800;
  margin-bottom:16px;
}

input,select,textarea{
  width:100%;
  border:1px solid #cbd5e1;
  border-radius:12px;
  padding:11px 12px;
  font-size:14px;
  background:white;
  margin-bottom:12px;
}

textarea{
  min-height:110px;
  resize:vertical;
}

button{
  border:none;
  border-radius:12px;
  padding:11px 15px;
  cursor:pointer;
  font-weight:700;
  background:var(--blue);
  color:white;
  transition:.15s;
}

button:hover{
  background:var(--blue-hover);
  transform:translateY(-1px);
}

button.green{background:var(--green)}
button.orange{background:var(--orange)}
button.red{background:var(--red)}
button.light{background:#e2e8f0;color:#1e293b}

.contact-item{
  background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.06);
  border-radius:14px;
  padding:12px;
  margin-bottom:10px;
  cursor:pointer;
  transition:.15s;
}

.contact-item:hover{
  background:rgba(255,255,255,.08);
}

.contact-name{font-weight:700}

.contact-meta{
  font-size:12px;
  color:#94a3b8;
  margin-top:4px;
}
/* ===================================================== BLOCK 3 – KONTAKTLISTE ===================================================== */ #contactList{ margin-top:14px; } .contact-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; } .contact-bottom{ display:flex; justify-content:space-between; align-items:center; margin-top:12px; } .contact-item.active{ background:rgba(96,165,250,.18); border:1px solid rgba(96,165,250,.45); } .status-badge{ padding:5px 9px; border-radius:999px; font-size:11px; font-weight:700; white-space:nowrap; } .status-badge.orange{ background:#ffedd5; color:#9a3412; } .status-badge.red{ background:#fee2e2; color:#991b1b; } .status-badge.blue{ background:#dbeafe; color:#1e3a8a; } .status-badge.green{ background:#dcfce7; color:#166534; } .chance-badge{ padding:4px 8px; border-radius:999px; font-size:11px; font-weight:700; } .chance-badge.high{ background:#dcfce7; color:#166534; } .chance-badge.medium{ background:#fef9c3; color:#854d0e; } .chance-badge.low{ background:#fee2e2; color:#991b1b; } .last-contact{ font-size:11px; color:#94a3b8; }

.grid3{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:14px;
}

.actions{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.actions.right{
  justify-content:flex-end;
}

.mt{margin-top:18px}

.hint{
  font-size:13px;
  color:var(--muted);
  line-height:1.5;
}

.small{font-size:12px}
.muted{color:var(--muted)}

.sub-block{
  background:var(--panel-soft);
  border:1px solid var(--line);
  border-radius:14px;
  padding:16px;
}

.sub-block-title{
  font-weight:800;
  margin-bottom:14px;
  font-size:18px;
}

.timeline-item{
  background:var(--panel-soft);
  border:1px solid var(--line);
  border-radius:14px;
  padding:14px;
  margin-bottom:12px;
}

.timeline-top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  margin-bottom:10px;
}

.timeline-text{
  white-space:pre-wrap;
  line-height:1.5;
}

.dropzone{
  border:2px dashed #b6c2d1;
  border-radius:16px;
  padding:28px;
  text-align:center;
  background:#f8fbff;
}

.file-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:var(--panel-soft);
  border:1px solid var(--line);
  border-radius:12px;
  padding:12px;
  margin-bottom:10px;
}

@media(max-width:1200px){
  #app{grid-template-columns:300px 1fr}
  .panel{display:none}
}

@media(max-width:850px){
  body{overflow:auto;height:auto}
  #app{display:block;height:auto}
  .sidebar,.main,.panel{display:block;width:100%}
  .grid3{grid-template-columns:1fr}
}
</style>
</head>

<body>

<div id="app">

  <aside class="sidebar">

    <h1>CRM v4</h1>

    
      <!-- ===================================================== BLOCK 3 – PROFESSIONELLE KONTAKTLISTE ===================================================== --> <div class="sidebar-section"> <div class="sidebar-title"> Kontakte </div> <!-- SUCHFELD --> <input type="text" id="searchInput" placeholder="Firma, Ort, Ansprechpartner..." > <!-- FILTER --> <select id="statusFilter"> <option> Alle Kontakte </option> <option> Termin vereinbart </option> <option> Unterlagen versendet </option> <option> Nachfassen </option> <option> Kein Interesse </option> <option> In weclapp </option> </select> <!-- KONTAKTLISTE --> <div id="contactList"> <div class="contact-item active"> <div class="contact-top"> <div class="contact-name"> Musterkunde GmbH </div> <div class="status-badge orange"> Termin </div> </div> <div class="contact-meta"> Linz · Fachpartner </div> <div class="contact-meta"> Max Mustermann </div> <div class="contact-bottom"> <div class="chance-badge high"> Hoch </div> <div class="last-contact"> vor 2 Tagen </div> </div> </div> </div> </div>

    <div class="sidebar-section">
      <div class="sidebar-title">Kontakte</div>

      <div class="contact-item">
        <div class="contact-name">Musterkunde GmbH</div>
        <div class="contact-meta">Linz · Fachpartner</div>
      </div>

      <div class="contact-item">
        <div class="contact-name">Elektro Beispiel</div>
        <div class="contact-meta">Wels · B2B</div>
      </div>
    </div>

  </aside>

  <main class="main">

    <!-- ===================================================== BLOCK 4 – KUNDENAKTE PRO ===================================================== --> <div class="card"> <div class="card-title"> Kundenakte </div> <div class="grid2"> <div class="full"> <label>Firma</label> <input type="text" placeholder="Firmenname"> </div> <div> <label>Straße</label> <input type="text" placeholder="Straße + Nummer"> </div> <div> <label>PLZ / Ort</label> <input type="text" placeholder="PLZ + Ort"> </div> <div> <label>Bundesland</label> <select> <option>Oberösterreich</option> <option>Niederösterreich</option> <option>Wien</option> <option>Steiermark</option> <option>Salzburg</option> <option>Tirol</option> <option>Vorarlberg</option> <option>Kärnten</option> <option>Burgenland</option> </select> </div> <div> <label>Kundentyp</label> <select> <option>Fachpartner</option> <option>B2B</option> <option>Privat</option> <option>Sonstiges</option> </select> </div> <div> <label>Kundenstatus</label> <select> <option>Lead</option> <option>Interessent</option> <option>Termin vereinbart</option> <option>Kunde</option> <option>Kein Interesse</option> </select> </div> <div> <label>Potenzial</label> <select> <option>klein</option> <option>mittel</option> <option>groß</option> </select> </div> <div> <label>Chancenbewertung</label> <select> <option>Sehr hoch</option> <option>Hoch</option> <option>Mittel</option> <option>Gering</option> <option>Sehr gering</option> </select> </div> </div> <!-- ================================= ANSPRECHPARTNER ================================== --> <div class="sub-block mt"> <div class="sub-block-title"> Ansprechpartner </div> <div class="grid2"> <div> <label>Vorname</label> <input type="text"> </div> <div> <label>Nachname</label> <input type="text"> </div> <div> <label>Telefon</label> <input type="text"> </div> <div> <label>E-Mail</label> <input type="email"> </div> <div class="full"> <label>Position / Rolle</label> <input type="text"> </div> </div> </div> <!-- ================================= BUTTONS ================================== --> <div class="actions right mt"> <button class="light"> In weclapp </button> <button> Speichern </button> </div> </div> 4. DANACH IM <style> BEREICH SUCHEN: .grid3{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:14px; } 5. DIREKT DARUNTER EINFÜGEN: .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:14px; } .full{ grid-column:1/-1; } 6. UND GANZ UNTEN IM STYLE BEREICH SUCHEN: .grid3{grid-template-columns:1fr} 7. DIREKT DARUNTER EINFÜGEN: .grid2{grid-template-columns:1fr}

    <div class="card">
      <div class="card-title">Neue Aktivität</div>

      <div class="hint" style="margin-bottom:18px;">
        Aktivitätsdatum = wann du etwas gemacht hast.
        Termindatum = wann der vereinbarte Termin/Rückruf stattfinden soll.
      </div>

      <div class="sub-block">
        <div class="sub-block-title">📞 Aktivität</div>

        <div class="grid3">
          <div>
            <label>Aktivitätsdatum</label>
            <input type="date" id="noteDate">
          </div>

          <div>
            <label>Aktivitätszeit</label>
            <input type="time" id="noteTime">
          </div>

          <div>
            <label>Art der Aktivität</label>
            <select id="noteType">
              <option>📞 Telefonat geführt</option>
              <option>📧 Mail gesendet</option>
              <option>👤 Persönlicher Besuch</option>
              <option>💻 Teams Call</option>
              <option>📄 Unterlagen gesendet</option>
              <option>📄 Angebot erstellt</option>
              <option>⭐ Erstkontakt</option>
              <option>Sonstiges</option>
            </select>
          </div>
        </div>

        <label>Was wurde besprochen / Ergebnis</label>
        <textarea id="activityText" placeholder="Zum Beispiel: Kunde interessiert sich für FENECON, möchte Preise, Projekt grob besprochen ..."></textarea>
      </div>

      <div class="sub-block mt">
        <div class="sub-block-title">📅 Termin / Rückruf optional</div>

        <div class="grid3">
          <div>
            <label>Termindatum</label>
            <input type="date" id="appointmentDate">
          </div>

          <div>
            <label>Terminzeit</label>
            <input type="time" id="appointmentTime">
          </div>

          <div>
            <label>Art des Termins</label>
            <select id="appointmentType">
              <option value="">Kein Termin / Rückruf</option>
              <option>📅 Termin vereinbart</option>
              <option>📞 Anruf</option>
              <option>⏰ Rückruf vereinbart</option>
              <option>👤 Persönlicher Termin</option>
              <option>💻 Online-Termin</option>
              <option>📧 Mail nachfassen</option>
              <option>Sonstiges</option>
            </select>
          </div>
        </div>

        <label>Notiz zum Termin / Rückruf</label>
        <textarea id="appointmentText" placeholder="Zum Beispiel: Rückruf wegen Angebot, Vor-Ort-Termin, Unterlagen nachfassen ..."></textarea>
      </div>

      <div class="actions right mt">
        <button class="orange">📄 Unterlagen versendet</button>
        <button class="red">Kein Interesse</button>
        <button class="green">Eintrag hinzufügen</button>
      </div>
    </div>

    <div class="card">
      <div class="card-title">Aktivitäten / Timeline</div>

      <div id="timelineContainer">
        <div class="timeline-item">
          <div class="timeline-top">
            <div>
              <strong>07.05.2026 · 10:30</strong>
              <div class="muted small">📞 Telefonat geführt</div>
            </div>
          </div>

          <div class="timeline-text">
Kunde interessiert sich für FENECON Home.
Preise senden.
Rückruf nächste Woche.
          </div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">Anhänge / Unterlagen</div>

      <div class="dropzone" id="dropzone">
        <strong>Dateien hier auf den Kunden ziehen</strong>

        <div class="hint" style="margin-top:8px;">
          Outlook-Mail als .msg, PDF, Angebot, Screenshot oder sonstige Unterlagen.
        </div>

        <div style="margin-top:16px;">
          <button>Dateien auswählen</button>
        </div>
      </div>

      <div style="margin-top:18px;">
        <div class="file-row">
          <div>
            <strong>Angebot_Fenecon.pdf</strong>
            <div class="small muted">PDF · 1.2 MB</div>
          </div>

          <button class="light">Öffnen</button>
        </div>
      </div>
    </div>

  </main>

  <aside class="panel">

    <div class="panel-box">
      <strong>Heute fällig</strong>
      <p>4 Kontakte nachfassen</p>
    </div>

    <div class="panel-box">
      <strong>KI Empfehlungen</strong>
      <p>Kunde seit 14 Tagen ohne Aktivität.</p>
    </div>

    <div class="panel-box">
      <strong>Chancenbewertung</strong>
      <p>Hoch</p>
    </div>

  </aside>

</div>

</body>
</html>
