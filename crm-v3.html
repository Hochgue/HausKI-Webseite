<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Mini CRM Pro Active</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
/* --- MINIMAL MODERN UI (Variante A) ------------------- */
body {
  margin: 0;
  font-family: system-ui, Arial;
  background: #f5f7fa;
  color: #1e293b;
  display: flex;
  height: 100vh;
  overflow: hidden;
}

#app { display: grid; grid-template-columns: 300px 1fr 350px; width: 100%; }

/* --- Seiten: links / mitte / rechts ------------------- */
.sidebar {
  border-right: 1px solid #dce2ea;
  padding: 12px;
  overflow-y: auto;
  background: #ffffff;
}

.content {
  padding: 16px;
  overflow-y: auto;
}

.panel {
  border-left: 1px solid #dce2ea;
  padding: 16px;
  overflow-y: auto;
  background: #ffffff;
}

/* Kontaktliste */
.contact-item {
  padding: 10px;
  border-radius: 10px;
  margin-bottom: 6px;
  cursor: pointer;
  border: 1px solid #e0e5ec;
}
.contact-item.active {
  background: #e8f0fe;
  border-color: #90b4ff;
}

/* Hauptkarte */
.card {
  background: #fff;
  border-radius: 14px;
  padding: 16px;
  border: 1px solid #e0e5ec;
  margin-bottom: 16px;
}

/* Timeline (Chat-Stil) */
.timeline-item {
  background: #f1f5f9;
  padding: 12px;
  border-radius: 12px;
  margin-bottom: 10px;
  white-space: pre-wrap;
}

/* Eingabefeld */
#activityInput {
  width: 100%;
  padding: 12px;
  border-radius: 12px;
  border: 1px solid #cdd4df;
  margin-top: 10px;
  font-size: 15px;
}

/* Buttons */
.btn {
  padding: 10px 14px;
  border-radius: 8px;
  font-weight: 600;
  cursor: pointer;
  border: none;
}
.btn-primary { background: #2563eb; color: #fff; }
.btn-light { background: #e2e8f0; color: #1e293b; }
</style>
</head>

<body>

<div id="app">

  <!-- -----------------------------------------------
       LINKER BEREICH — KONTAKTLISTE / SUCHE
  --------------------------------------------------->
  <div class="sidebar">
    <h2>Kontakte</h2>

    <input id="search" placeholder="Suchen..." style="width:100%;padding:10px;" oninput="filterContacts()">

    <div id="contactList"></div>
  </div>

  <!-- -----------------------------------------------
       MITTE — KONTAKTKARTE + TIMELINE
  --------------------------------------------------->
  <div class="content">
    <div id="contactView"></div>
  </div>

  <!-- -----------------------------------------------
       RECHTS — KI-PANEL / ZUSAMMENFASSUNG
  --------------------------------------------------->
  <div class="panel">
    <h3>KI Analyse</h3>
    <div id="aiSummary" class="card">Kein Kontakt ausgewählt.</div>
  </div>

</div>


<script type="module">

/* -------------------------------------------------------
   KONFIGURATION
--------------------------------------------------------- */
const OPENAI_API_KEY = "DEIN_OPENAI_API_KEY_HIER";
const SUPABASE_URL = "DEINE_SUPABASE_URL";
const SUPABASE_KEY = "DEIN_SUPABASE_ANON_KEY";

import { createClient } from "[cdn.jsdelivr.net](https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm)";
const db = createClient(SUPABASE_URL, SUPABASE_KEY);

/* -------------------------------------------------------
   GLOBALER STATE
--------------------------------------------------------- */
let contacts = [];
let activeContact = null;

/* -------------------------------------------------------
   OpenAI KI-FUNKTIONEN
--------------------------------------------------------- */
async function aiAnalyzeActivity(text) {
  const prompt = `
Analysiere diese Vertriebsaktivität und extrahiere:

1) Type (Telefon, Mail, Besuch, Unterlagen, Angebot, Sonstiges)
2) Kurze Zusammenfassung
3) Nächster sinnvoller Schritt
4) Datum für Wiedervorlage (falls erkennbar)
5) Statusänderung (falls sinnvoll)

Text: "${text}"
Erwarte JSON.
  `;

  const r = await fetch("[api.openai.com](https://api.openai.com/v1/chat/completions)", {
    method: "POST",
    headers: { "Content-Type": "application/json", Authorization: "Bearer " + OPENAI_API_KEY },
    body: JSON.stringify({
      model: "gpt-4.1-mini",
      messages: [{ role: "user", content: prompt }]
    })
  });

  const data = await r.json();
  try {
    return JSON.parse(data.choices[0].message.content);
  } catch {
    return null;
  }
}

/* -------------------------------------------------------
   SUPABASE LADEN
--------------------------------------------------------- */
async function loadContacts() {
  const { data } = await db.from("contacts").select("*").order("updated_at", { ascending: false });
  contacts = data || [];
  renderList();
}

/* -------------------------------------------------------
   RENDER LISTE
--------------------------------------------------------- */
function renderList() {
  const box = document.getElementById("contactList");
  box.innerHTML = contacts
    .map(c => `
      <div class="contact-item ${activeContact?.id === c.id ? "active" : ""}" onclick="selectContact('${c.id}')">
        <strong>${c.firma || "(ohne Firma)"}</strong><br>
        <span style="font-size:13px;color:#64748b;">${c.ort || ""}</span>
      </div>
    `).join("");
}

/* -------------------------------------------------------
   KONTAKT AUSWÄHLEN
--------------------------------------------------------- */
window.selectContact = function(id) {
  activeContact = contacts.find(c => c.id === id);
  renderContactView();
};

/* -------------------------------------------------------
   RENDER KONTAKTDETAILS
--------------------------------------------------------- */
async function renderContactView() {
  if (!activeContact) return;

  const html = `
    <div class="card">
      <h2>${activeContact.firma}</h2>
      <div>${activeContact.name || ""}</div>
      <div>${activeContact.telefon || ""}</div>
      <div>${activeContact.email || ""}</div>
      <div style="margin-top:10px;color:#64748b;">
        Status: ${activeContact.status || "-"}
      </div>
    </div>

    <h3>Aktivitäten</h3>
    <div id="timeline"></div>

    <textarea id="activityInput" placeholder="Neue Aktivität eingeben..."></textarea>
    <button class="btn btn-primary" style="margin-top:10px;" onclick="addActivity()">Eintragen</button>
  `;

  document.getElementById("contactView").innerHTML = html;

  const { data: activities } = await db.from("activities")
    .select("*")
    .eq("contact_id", activeContact.id)
    .order("created_at", { ascending: false });

  const tl = document.getElementById("timeline");
  tl.innerHTML = activities
    .map(a => `<div class="timeline-item">${a.text}</div>`)
    .join("");

  // KI-Zusammenfassung mitladen
  updateAISummary();
}

/* -------------------------------------------------------
   NEUE AKTIVITÄT (mit KI)
--------------------------------------------------------- */
window.addActivity = async function() {
  const text = document.getElementById("activityInput").value.trim();
  if (!text) return;

  const ai = await aiAnalyzeActivity(text);

  await db.from("activities").insert({
    contact_id: activeContact.id,
    text: text,
    ai_summary: ai?.summary || "",
    ai_next_step: ai?.next_step || "",
    ai_followup: ai?.followup_date || "",
    ai_status: ai?.status || ""
  });

  // ggf. Status aktualisieren
  if (ai && ai.status) {
    await db.from("contacts").update({ status: ai.status }).eq("id", activeContact.id);
  }

  document.getElementById("activityInput").value = "";

  loadContacts();
  renderContactView();
};

/* -------------------------------------------------------
   KI PANEL UPDATEN
--------------------------------------------------------- */
async function updateAISummary() {
  if (!activeContact) return;

  const prompt = `
Fasse den Kontakt kurz zusammen:

Firma: ${activeContact.firma}
Letzte Aktivitäten: kurz in 1-2 Sätzen, priorisiert für Vertrieb.
`;

  const r = await fetch("[api.openai.com](https://api.openai.com/v1/chat/completions)", {
    method: "POST",
    headers: { "Content-Type": "application/json", Authorization: "Bearer " + OPENAI_API_KEY },
    body: JSON.stringify({
      model: "gpt-4.1-mini",
      messages: [{ role: "user", content: prompt }]
    })
  });

  const data = await r.json();
  const summary = data.choices?.[0]?.message?.content || "Keine Daten.";

  document.getElementById("aiSummary").innerText = summary;
}

/* -------------------------------------------------------
   SUCHE
--------------------------------------------------------- */
window.filterContacts = function() {
  const s = document.getElementById("search").value.toLowerCase();
  const filtered = contacts.filter(c =>
    (c.firma || "").toLowerCase().includes(s) ||
    (c.ort || "").toLowerCase().includes(s)
  );
  const box = document.getElementById("contactList");
  box.innerHTML = filtered
    .map(c => `
      <div class="contact-item" onclick="selectContact('${c.id}')">
        <strong>${c.firma}</strong><br>
        <span style="font-size:13px;color:#64748b;">${c.ort}</span>
      </div>
    `).join("");
};

/* INITIAL LOAD */
loadContacts();

</script>
</body>
</html>
