<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Mini CRM Pro Active — v1.1</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  font-family: system-ui, Arial;
  background: #f5f7fa;
  color: #1e293b;
  display: flex;
  height: 100vh;
  overflow: hidden;
}

#app {
  display: grid;
  grid-template-columns: 300px 1fr 350px;
  height: 100%;
  width: 100%;
}

/* Sidebar */
.sidebar {
  background: white;
  padding: 14px;
  border-right: 1px solid #dce2ea;
  overflow-y: auto;
}

.contact-item {
  padding: 10px;
  border: 1px solid #dbe2ec;
  border-radius: 10px;
  margin-bottom: 8px;
  cursor: pointer;
}
.contact-item:hover { background: #eef3ff; }
.contact-item.active {
  background: #e4edff;
  border-color: #90b4ff;
}

/* Content */
.content {
  padding: 20px;
  overflow-y: auto;
}

.card {
  background: white;
  border-radius: 14px;
  padding: 16px;
  border: 1px solid #dde3ec;
  margin-bottom: 20px;
}

/* Timeline */
.timeline-item {
  background: #f1f5f9;
  padding: 12px;
  border-radius: 12px;
  margin-bottom: 12px;
}

/* Eingabe */
#activityInput {
  width: 100%;
  padding: 12px;
  font-size: 15px;
  border-radius: 10px;
  border: 1px solid #cdd4df;
  margin-top: 10px;
}

/* Buttons */
.btn {
  padding: 10px 14px;
  border-radius: 8px;
  border: none;
  cursor: pointer;
}
.btn-primary { background: #2563eb; color: white; }
.btn-light { background: #e2e8f0; color: #1e293b; }

/* Right panel */
.panel {
  background: white;
  border-left: 1px solid #dce2ea;
  padding: 20px;
  overflow-y: auto;
}
</style>
</head>

<body>

<div id="app">

  <!-- LINKS: Kontaktliste -->
  <div class="sidebar">
    <h2>Kontakte</h2>

    <input id="search" placeholder="Suchen..." style="width:100%;padding:10px;margin-bottom:10px;" oninput="filterContacts()">

    <div id="contactList"></div>
  </div>

  <!-- MITTE: Kontaktkarte + Timeline -->
  <div class="content">
    <div id="contactView">Bitte Kontakt auswählen.</div>
  </div>

  <!-- RECHTS: KI Panel -->
  <div class="panel">
    <h3>KI Analyse</h3>
    <div id="aiSummary" class="card">
      Kein Kontakt ausgewählt.
    </div>
  </div>

</div>


<!-- JAVASCRIPT -->
<script type="module">

/* -------------------------------------------------------
   KONFIGURATION
--------------------------------------------------------- */
const OPENAI_API_KEY = "DEIN_OPENAI_KEY";
const SUPABASE_URL = "DEINE_URL";
const SUPABASE_KEY = "DEIN_SUPABASE_ANON";

/* Supabase Client */
import { createClient } from "[cdn.jsdelivr.net](https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm)";
const db = createClient(SUPABASE_URL, SUPABASE_KEY);

/* GLOBALER STATE */
let contacts = [];
let activeContact = null;

/* -------------------------------------------------------
   KI AKTIVITÄTS-ANALYSE
--------------------------------------------------------- */
async function aiAnalyzeActivity(text) {
  const prompt = `
Analysiere die folgende Vertriebsaktivität:

"${text}"

Extrahiere:
- Aktivitätstyp
- Kurz-Zusammenfassung
- sinnvollen nächsten Schritt
- Wiedervorlage-Datum (falls erkennbar)
- passenden Status

Antwort als JSON.
`;

  try {
    const r = await fetch("[api.openai.com](https://api.openai.com/v1/chat/completions)", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        Authorization: "Bearer " + OPENAI_API_KEY
      },
      body: JSON.stringify({
        model: "gpt-4.1-mini",
        messages: [{ role: "user", content: prompt }]
      })
    });

    const data = await r.json();
    return JSON.parse(data.choices[0].message.content);

  } catch (err) {
    console.error("AI Fehler:", err);
    return null;
  }
}

/* -------------------------------------------------------
   KONTAKTE LADEN
--------------------------------------------------------- */
async function loadContacts() {
  const { data } = await db.from("contacts").select("*").order("updated_at", { ascending: false });
  contacts = data || [];
  renderList();
}

/* -------------------------------------------------------
   KONTAKTLISTE RENDERN
--------------------------------------------------------- */
function renderList() {
  const box = document.getElementById("contactList");

  box.innerHTML = contacts.map(c => `
    <div class="contact-item ${activeContact?.id === c.id ? "active" : ""}"
         onclick="selectContact('${c.id}')">
      <strong>${c.firma || "(ohne Firma)"}</strong><br>
      <span style="font-size:13px;color:#64748b;">${c.ort || ""}</span>
    </div>
  `).join("");
}

/* -------------------------------------------------------
   KONTAKT AUSWÄHLEN (GLOBAL)
--------------------------------------------------------- */
window.selectContact = async function(id) {
  activeContact = contacts.find(c => c.id === id);
  renderContactView();
  updateAISummary();
};

/* -------------------------------------------------------
   KONTAKT-DETAILS MITTE
--------------------------------------------------------- */
async function renderContactView() {
  if (!activeContact) {
    document.getElementById("contactView").innerHTML = "Bitte Kontakt auswählen.";
    return;
  }

  const c = activeContact;

  const html = `
    <div class="card">
      <h2>${c.firma || "(ohne Firma)"}</h2>
      <div>${c.name || "–"}</div>
      <div>${c.telefon || "–"}</div>
      <div>${c.email || "–"}</div>
      <div>${c.ort || "–"}</div>
      <div style="margin-top:10px;">Status: ${c.status || "Neu"}</div>
    </div>

    <h3>Aktivitäten</h3>
    <div id="timeline"></div>

    <textarea id="activityInput" placeholder="Neue Aktivität eingeben..."></textarea>
    <button class="btn btn-primary" style="margin-top:10px;" onclick="addActivity()">Eintragen</button>
  `;

  document.getElementById("contactView").innerHTML = html;

  // Timeline laden
  const { data: activities } = await db.from("activities")
    .select("*")
    .eq("contact_id", c.id)
    .order("created_at", { ascending: false });

  const tl = document.getElementById("timeline");
  tl.innerHTML = (activities?.length)
    ? activities.map(a => `<div class="timeline-item">${a.text}</div>`).join("")
    : "<div class='timeline-item'>Noch keine Aktivitäten</div>";
}

/* -------------------------------------------------------
   AKTIVITÄT HINZUFÜGEN
--------------------------------------------------------- */
window.addActivity = async function() {
  const text = document.getElementById("activityInput").value.trim();
  if (!text) return;

  const ai = await aiAnalyzeActivity(text);

  await db.from("activities").insert({
    contact_id: activeContact.id,
    text,
    ai_summary: ai?.summary || "",
    ai_next_step: ai?.next_step || "",
    ai_followup: ai?.followup || null,
    ai_status: ai?.status || ""
  });

  // Kontaktstatus updaten
  if (ai?.status) {
    await db.from("contacts").update({ status: ai.status }).eq("id", activeContact.id);
  }

  document.getElementById("activityInput").value = "";

  loadContacts();
  renderContactView();
  updateAISummary();
};

/* -------------------------------------------------------
   KI-ZUSAMMENFASSUNG (RIGHT PANEL)
--------------------------------------------------------- */
async function updateAISummary() {
  if (!activeContact) {
    document.getElementById("aiSummary").innerText = "Kein Kontakt ausgewählt.";
    return;
  }

  const prompt = `
Erstelle eine kurze, präzise Zusammenfassung für den Vertrieb:

Firma: ${activeContact.firma}
Ort: ${activeContact.ort}
Status: ${activeContact.status}

Schreibe 1–2 Sätze.
`;

  try {
    const r = await fetch("[api.openai.com](https://api.openai.com/v1/chat/completions)", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        Authorization: "Bearer " + OPENAI_API_KEY
      },
      body: JSON.stringify({
        model: "gpt-4.1-mini",
        messages: [{ role: "user", content: prompt }]
      })
    });

    const data = await r.json();
    document.getElementById("aiSummary").innerText = data.choices[0].message.content;

  } catch {
    document.getElementById("aiSummary").innerText = "Zusammenfassung nicht verfügbar.";
  }
}

/* -------------------------------------------------------
   FILTER
--------------------------------------------------------- */
window.filterContacts = function() {
  const s = document.getElementById("search").value.toLowerCase();

  const filtered = contacts.filter(c =>
    (c.firma || "").toLowerCase().includes(s) ||
    (c.ort || "").toLowerCase().includes(s) ||
    (c.name || "").toLowerCase().includes(s)
  );

  const box = document.getElementById("contactList");
  box.innerHTML = filtered.map(c => `
    <div class="contact-item" onclick="selectContact('${c.id}')">
      <strong>${c.firma}</strong><br>
      <span style="font-size:13px;color:#64748b;">${c.ort || ""}</span>
    </div>
  `).join("");
};

/* INITIAL LADEN */
loadContacts();

</script>

</body>
</html>
