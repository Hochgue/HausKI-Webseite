<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRM v4 Hybrid</title>

<style>
:root{
  --bg:#e9eef5;

  --sidebar:#0f172a;
  --sidebar-light:#1e293b;

  --panel:#ffffff;
  --panel-soft:#f8fafc;

  --line:#d8e1ea;

  --text:#1e293b;
  --muted:#64748b;

  --blue:#4f6b8a;
  --blue-hover:#5f7897;

  --green:#16a34a;
  --orange:#f59e0b;
  --red:#dc2626;

  --shadow:0 10px 25px rgba(15,23,42,.08);
  --radius:16px;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Inter,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  height:100vh;
  overflow:hidden;
}

/* =========================
   LAYOUT
========================= */

#app{
  display:grid;
  grid-template-columns:320px 1fr 360px;
  height:100vh;
}

/* =========================
   SIDEBAR LINKS
========================= */

.sidebar{
  background:linear-gradient(
    180deg,
    var(--sidebar),
    #162235
  );

  color:white;

  border-right:1px solid rgba(255,255,255,.05);

  padding:18px;

  overflow-y:auto;
}

.sidebar h1{
  margin-top:0;
  font-size:24px;
}

.sidebar-section{
  margin-top:24px;
}

.sidebar-title{
  font-size:12px;
  text-transform:uppercase;
  letter-spacing:.08em;
  color:#94a3b8;
  margin-bottom:10px;
}

/* =========================
   MITTE
========================= */

.main{
  padding:22px;
  overflow-y:auto;
}

.card{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:18px;
  margin-bottom:18px;
  box-shadow:var(--shadow);
}

.card-title{
  font-size:22px;
  font-weight:800;
  margin-bottom:16px;
}

/* =========================
   RECHTE SEITE
========================= */

.panel{
  background:#f4f7fb;

  border-left:1px solid var(--line);

  padding:18px;

  overflow-y:auto;
}

.panel-box{
  background:white;
  border:1px solid var(--line);
  border-radius:14px;
  padding:14px;
  margin-bottom:16px;
  box-shadow:var(--shadow);
}

/* =========================
   INPUTS
========================= */

input,
select,
textarea{
  width:100%;
  border:1px solid #cbd5e1;
  border-radius:12px;
  padding:11px 12px;
  font-size:14px;
  background:white;
  margin-bottom:12px;
}

textarea{
  min-height:110px;
  resize:vertical;
}

/* =========================
   BUTTONS
========================= */

button{
  border:none;
  border-radius:12px;
  padding:11px 15px;
  cursor:pointer;
  font-weight:700;
  background:var(--blue);
  color:white;
  transition:.15s;
}

button:hover{
  background:var(--blue-hover);
  transform:translateY(-1px);
}

button.green{
  background:var(--green);
}

button.orange{
  background:var(--orange);
}

button.red{
  background:var(--red);
}

/* =========================
   CONTACT ITEM
========================= */

.contact-item{
  background:rgba(255,255,255,.05);

  border:1px solid rgba(255,255,255,.06);

  border-radius:14px;

  padding:12px;

  margin-bottom:10px;

  cursor:pointer;

  transition:.15s;
}

.contact-item:hover{
  background:rgba(255,255,255,.08);
}

.contact-name{
  font-weight:700;
}

.contact-meta{
  font-size:12px;
  color:#94a3b8;
  margin-top:4px;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:1200px){

  #app{
    grid-template-columns:300px 1fr;
  }

  .panel{
    display:none;
  }
}

@media(max-width:850px){

  body{
    overflow:auto;
    height:auto;
  }

  #app{
    display:block;
    height:auto;
  }

  .sidebar,
  .main,
  .panel{
    display:block;
    width:100%;
  }
}
</style>
</head>

<body>

<div id="app">

  <!-- SIDEBAR -->
  <aside class="sidebar">

    <h1>CRM v4</h1>

    <div class="sidebar-section">

      <div class="sidebar-title">
        Suche
      </div>

      <input
        type="text"
        placeholder="Firma, Ort, Ansprechpartner..."
      >

    </div>

    <div class="sidebar-section">

      <div class="sidebar-title">
        Kontakte
      </div>

      <div class="contact-item">
        <div class="contact-name">
          Musterkunde GmbH
        </div>

        <div class="contact-meta">
          Linz · Fachpartner
        </div>
      </div>

      <div class="contact-item">
        <div class="contact-name">
          Elektro Beispiel
        </div>

        <div class="contact-meta">
          Wels · B2B
        </div>
      </div>

    </div>

  </aside>

  <!-- MITTE -->
  <main class="main">

    <div class="card">

      <div class="card-title">
        Kundenakte
      </div>

      <input placeholder="Firma">

      <input placeholder="Ansprechpartner">

      <textarea placeholder="Notizen..."></textarea>

      <button>
        Speichern
      </button>

    </div>

    <div class="card">

      <div class="card-title">
        Aktivitäten
      </div>

      <textarea placeholder="Neue Aktivität eintragen..."></textarea>

      <button class="green">
        Aktivität speichern
      </button>

    </div>

  </main>

  <!-- RECHTS -->
  <aside class="panel">

    <div class="panel-box">

      <strong>
        Heute fällig
      </strong>

      <p>
        4 Kontakte nachfassen
      </p>

    </div>

    <div class="panel-box">

      <strong>
        KI Empfehlungen
      </strong>

      <p>
        Kunde seit 14 Tagen ohne Aktivität.
      </p>

    </div>

    <div class="panel-box">

      <strong>
        Chancenbewertung
      </strong>

      <p>
        Hoch
      </p>

    </div>

  </aside>

</div>

</body>
</html>
