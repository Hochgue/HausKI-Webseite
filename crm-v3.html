<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex,nofollow">

<title>Mini CRM Vertrieb – v3 Pro Active mit v2 Daten</title>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<style>
:root{
  --bg:#edf2f7;--panel:#ffffff;--line:#d9e2ec;--text:#1e293b;--muted:#64748b;
  --blue:#4f6b8a;--blue2:#5d7b9d;--green:#16a34a;--red:#dc2626;--yellow:#facc15;--orange:#fb923c;--violet:#7c3aed;
  --shadow:0 10px 25px rgba(15,23,42,.08);--radius:14px;
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden}
button{background:var(--blue);color:white;border:none;border-radius:10px;padding:10px 14px;cursor:pointer;font-weight:700;font-size:13px;transition:.15s ease}
button:hover{background:var(--blue2);transform:translateY(-1px)}
button.primary{background:var(--green)}button.delete{background:var(--red)!important}button.light{background:#e2e8f0;color:#111827}.hidden{display:none!important}
#app{display:grid;grid-template-columns:330px 1fr 380px;height:100vh;width:100vw}
.sidebar,.panel{background:var(--panel);padding:16px;overflow-y:auto}.sidebar{border-right:1px solid var(--line)}.panel{border-left:1px solid var(--line)}.content{padding:20px;overflow-y:auto}
.top-actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.top-actions button{flex:1;min-width:120px}
h1,h2,h3,h4{margin-top:0}.muted{color:var(--muted)}.small{font-size:12px}.hint{font-size:12px;color:var(--muted);line-height:1.35}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.mt{margin-top:14px}.mt-small{margin-top:8px}
.card{background:white;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:16px}.mini-card{background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
input,select,textarea{width:100%;padding:10px 11px;border:1px solid #cbd5e1;border-radius:10px;background:white;color:var(--text);font-size:14px;margin-bottom:10px}textarea{min-height:90px;resize:vertical;line-height:1.45}label{display:block;font-size:12px;color:var(--muted);font-weight:700;margin-bottom:5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}.grid4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:12px}.full{grid-column:1/-1}
.contact-list{display:flex;flex-direction:column;gap:9px}.contact-item{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;transition:.15s ease}.contact-item:hover{background:#f8fbff;transform:translateY(-1px)}.contact-item.active{background:#eaf1ff;border-color:#8bb3ff}.contact-item.in-weclapp{background:#eff6ff;border-color:#93c5fd}.contact-title{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.contact-meta{font-size:12px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{display:inline-block;padding:6px 10px;border-radius:999px;font-size:12px;font-weight:800;color:#111827}.badge.orange{background:var(--orange)}.badge.yellow{background:var(--yellow)}.badge.green{background:#bbf7d0;color:#14532d}.badge.blue{background:#bfdbfe;color:#1e3a8a}.badge.red{background:#fee2e2;color:#991b1b}.badge.violet{background:#ede9fe;color:#5b21b6}.badge.gray{background:#e2e8f0;color:#475569}
.chance-badge{display:inline-block;padding:5px 9px;border-radius:999px;font-weight:800;font-size:11px;margin-top:6px}.chance-sehr-hoch{background:#bbf7d0;color:#14532d;border:1px solid #86efac}.chance-hoch{background:#dcfce7;color:#166534;border:1px solid #86efac}.chance-mittel{background:#fef9c3;color:#854d0e;border:1px solid #fde68a}.chance-gering{background:#ffedd5;color:#9a3412;border:1px solid #fdba74}.chance-sehr-gering{background:#fee2e2;color:#991b1b;border:1px solid #fca5a5}.chance-none{background:#e2e8f0;color:#475569;border:1px solid #cbd5e1}
.timeline-item{background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px;margin-bottom:10px}.timeline-head{display:flex;justify-content:space-between;gap:10px}.timeline-text{white-space:pre-wrap;line-height:1.45}.ai-box{background:#eef6ff;border-left:4px solid #2563eb;border-radius:8px;padding:10px}.due-box{background:#fff7ed;border:1px solid #fdba74;color:#9a3412;border-radius:12px;padding:12px;margin-bottom:12px}.empty{padding:14px;border:1px dashed var(--line);border-radius:10px;color:var(--muted);background:#fafcff}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.actions.right{justify-content:flex-end}.link{color:#2563eb;font-weight:700;text-decoration:none}.section-title{font-size:22px;font-weight:800;margin-bottom:12px}
.subcontact-card,.attachment-item{border:1px solid var(--line);border-radius:12px;padding:12px;background:#fbfcfd;margin-bottom:10px}.dropzone{border:2px dashed #a8b6c6;border-radius:12px;padding:16px;background:#f8fbff;text-align:center;color:#455468}.dropzone.dragover{border-color:#5f7897;background:#edf4fb}.dropzone input[type=file]{display:none}.save-state{font-size:12px;font-weight:700;color:#475569}.status-dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-left:6px}.dot-red{background:#dc2626}.dot-green{background:#16a34a}.dot-orange{background:#f97316}.dot-blue{background:#2563eb}.dot-gray{background:#94a3b8}
.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:center;justify-content:center;z-index:99}.modal{background:white;border-radius:18px;padding:20px;width:min(720px,94vw);max-height:90vh;overflow:auto;box-shadow:var(--shadow)}
@media(max-width:1250px){#app{grid-template-columns:320px 1fr}.panel{display:none}.grid4{grid-template-columns:1fr 1fr}.grid3{grid-template-columns:1fr 1fr}}
@media(max-width:800px){body{height:auto;overflow:auto}#app{display:block;height:auto}.sidebar,.content,.panel{display:block;border:none}.panel{display:block}.grid2,.grid3,.grid4{grid-template-columns:1fr}}
</style>
</head>
<body>

<div id="app">
  <aside class="sidebar">
    <h2>CRM v3</h2>
    <div class="save-state" id="saveState">Bereit</div>

    <div class="top-actions mt">
      <button onclick="newContact()">+ Neuer Kontakt</button>
      <button class="light" onclick="document.getElementById('csvInput').click()">CSV Import</button>
      <button class="light" onclick="loadData()">Neu laden</button>
    </div>

    <div id="dueBox"></div>

    <input id="search" placeholder="Suchen: Firma, Ort, Name, Notiz ..." oninput="renderList()">
    <select id="statusFilter" onchange="renderList()">
      <option>Alle</option>
      <option>Lead</option>
      <option>Ohne Status</option>
      <option>Termin vereinbart</option>
      <option>Unterlagen versendet</option>
      <option>Telefonat ausgemacht</option>
      <option>Termin abgesagt</option>
      <option>Sonstiges</option>
      <option>Kein Interesse</option>
      <option>Archiviert</option>
      <option>In weclapp</option>
    </select>
    <select id="kundentypFilter" onchange="renderList()">
      <option>Alle</option><option>Fachpartner</option><option>B2B</option><option>Privat</option><option>Sonstiges</option>

    <input id="regionFilter" placeholder="Region / Bezirk / Bundesland" oninput="renderList()">

    <div class="top-actions">
      <button class="light" onclick="sortBy('firma')">Firma</button>
      <button class="light" onclick="sortBy('ort')">Ort</button>

    </div>

    <label class="row" style="justify-content:flex-start;gap:8px;margin-bottom:10px;font-size:13px;">
      <input type="checkbox" id="showRecent" checked onchange="renderList()" style="width:auto;margin:0;"> Letzte 12 ohne Suche anzeigen

  <main class="content">
    <div id="contactView"><div class="empty">Bitte Kontakt auswählen.</div></div>

  <aside class="panel">
    <h3>Aktive Analyse</h3>
    <div id="aiPanel" class="card">Kein Kontakt ausgewählt.</div>
    <h3>Anhänge</h3>
    <div id="attachmentPanel" class="card">Keine Anhänge.</div>
    <h3>Letzte Aktivitäten</h3>
    <div id="activityPanel" class="card">Keine Aktivitäten.</div>
  </aside>
</div>

<input type="file" id="attachmentInput" multiple class="hidden" onchange="handleAttachmentInput(event)">
<input type="file" id="csvInput" accept=".csv" class="hidden">
<input type="file" id="jsonInput" accept=".json" class="hidden">
<div id="modal"></div>

<script>
/* =========================================================
   SUPABASE KONFIGURATION – bestehende v2 Datenstruktur
========================================================= */
const SUPABASE_URL = "https://wuizcshgkdolkngqoutj.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind1aXpjc2hna2RvbGtuZ3FvdXRqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM2ODE5OTgsImV4cCI6MjA4OTI1Nzk5OH0.C5SuBH9h1UQAUqOyZ7BYLqoRNR1QPOr0SXadeQJR1HM";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const STORAGE_KEY = "mini_crm_v3_pro_active_v2_backup";
let contacts = [];
let selectedId = null;
let currentSort = "";
let dueFilterActive = false;
let isLoading = false;
let autosaveTimer = null;

/* =========================================================
   HELPER
========================================================= */
function $(id){return document.getElementById(id)}
function todayStr(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function esc(v){return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function normalizeDate(v){v=String(v||"").trim();return v===""?null:v}
function normalizeTime(v){v=String(v||"").trim();return v===""?null:v}
function formatDateDisplay(v){if(!v)return"-";if(/^\d{4}-\d{2}-\d{2}$/.test(v)){const[y,m,d]=v.split("-");return `${d}.${m}.${y}`}return v}
function addDays(dateStr,days){if(!dateStr)return"";const d=new Date(dateStr+"T12:00:00");d.setDate(d.getDate()+days);return d.toISOString().slice(0,10)}
function isUuid(v){return /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{12}$/i.test(String(v||""))}
function cleanPhone(v){return String(v||"").replace(/[^+\d]/g,"")}
function phoneLink(v){const raw=String(v||"").trim();return raw?`<a class="link" href="tel:${cleanPhone(raw)}" onclick="event.stopPropagation()">${esc(raw)}</a>`:""}
function mailLink(v){const raw=String(v||"").trim();return raw?`<a class="link" href="mailto:${esc(raw)}" onclick="event.stopPropagation()">${esc(raw)}</a>`:""}
function humanSize(bytes){if(!bytes&&bytes!==0)return"";if(bytes<1024)return bytes+" B";if(bytes<1024*1024)return(bytes/1024).toFixed(1)+" KB";return(bytes/(1024*1024)).toFixed(1)+" MB"}
function setSaveState(msg,isError=false){$("saveState").textContent=msg;$("saveState").style.color=isError?"#b91c1c":"#475569"}
function getSelected(){return contacts.find(c=>c.id===selectedId)||null}
function isInWeclapp(c){return String(c?.weclapp||"").toLowerCase()==="ja"}
function getContactDateTime(c){if(!c||!c.naechsterkontakt)return null;return new Date(c.naechsterkontakt+"T"+(c.naechsterkontakt_zeit||"00:00"))}
function hasFutureNextContact(c){if(isInWeclapp(c))return false;const dt=getContactDateTime(c);return !!dt&&dt>=new Date()}
function getVisibleStatus(c){if(c.archived)return"Archiviert";if(isInWeclapp(c))return"In weclapp";if(String(c.status||"")==="Kein Interesse")return"Kein Interesse";if(String(c.status||"")==="Termin abgesagt")return"Termin abgesagt";if(hasFutureNextContact(c))return c.status||"";return""}
function badgeClass(status){if(status==="In weclapp")return"blue";if(status==="Kein Interesse"||status==="Termin abgesagt")return"red";if(status==="Termin vereinbart")return"yellow";if(status==="Unterlagen versendet")return"violet";if(status==="Telefonat ausgemacht")return"orange";if(status==="Sonstiges")return"green";if(status==="Archiviert")return"violet";return"gray"}
function chanceClass(v){v=String(v||"").toLowerCase().trim();if(v==="sehr hoch")return"chance-sehr-hoch";if(v==="hoch")return"chance-hoch";if(v==="mittel")return"chance-mittel";if(v==="gering")return"chance-gering";if(v==="sehr gering")return"chance-sehr-gering";return"chance-none"}
function chanceLabel(v){return String(v||"").trim()||"Noch nicht bewertet"}
function persistLocalBackup(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify({saved_at:new Date().toISOString(),contacts}))}catch(e){}}

/* =========================================================
   DATEN-MAPPING v2 Tabellen
========================================================= */
function sanitizeContacts(list){
  return (Array.isArray(list)?list:[]).map(c=>({
    id:c.id||String(Date.now()+Math.random()),
    firma:c.firma||"",strasse:c.strasse||"",plz:c.plz||"",ort:c.ort||"",bezirk:c.bezirk||"",bundesland:c.bundesland||"Oberösterreich",
    kundentyp:c.kundentyp||"Fachpartner",kundenstatus:c.kundenstatus||"Interessent",status:c.status||"Sonstiges",
    erstkontakt:c.erstkontakt||"",naechsterkontakt:c.naechsterkontakt||"",naechsterkontakt_zeit:c.naechsterkontakt_zeit||"",kontaktart:c.kontaktart||"",
    weclapp:c.weclapp||"Nein",leadquelle:c.leadquelle||"",potenzial:c.potenzial||"mittel",chancenbewertung:c.chancenbewertung||"",
    nachname:c.nachname||"",vorname:c.vorname||"",rolle:c.rolle||"",telefon:c.telefon||"",mobil:c.mobil||"",email:c.email||"",
    notes_history:Array.isArray(c.notes_history)?c.notes_history:[],
    weitere_kontakte:Array.isArray(c.weitere_kontakte)?c.weitere_kontakte:[],
    attachments:Array.isArray(c.attachments)?c.attachments:[],
    archived:!!c.archived
  }))
}

function mapDbToContact(firma,ansprechpartnerRows,historieRows,anhaengeRows){
  const rows=(ansprechpartnerRows||[]).filter(r=>r.firma_id===firma.id);
  const historie=(historieRows||[])
  .filter(r=>String(r.firma_id)===String(firma.id))
  .sort((a,b)=>String(a.datum||"").localeCompare(String(b.datum||"")));
  const anhaenge=(anhaengeRows||[])
  .filter(r=>String(r.firma_id)===String(firma.id));
  const haupt=rows.find(r=>r.hauptkontakt)||rows[0]||{};
  const weitere=rows.filter(r=>!r.hauptkontakt).map(r=>({vorname:r.vorname||"",nachname:r.nachname||"",telefon:r.telefon||"",mobil:r.mobil||"",email:r.email||"",position:r.rolle||"",notiz:""}));

  return sanitizeContacts([{
    id:firma.id,
    firma:firma.firma||"",strasse:firma.strasse||"",plz:firma.plz||"",ort:firma.ort||"",bezirk:firma.bezirk||"",bundesland:firma.bundesland||"Oberösterreich",
    kundentyp:firma.kundentyp||"Fachpartner",kundenstatus:firma.kundenstatus||"Interessent",status:firma.status||"Sonstiges",
    erstkontakt:firma.erstkontakt||"",naechsterkontakt:firma.naechsterkontakt||"",naechsterkontakt_zeit:firma.naechsterkontakt_zeit||"",kontaktart:firma.kontaktart||"",
    weclapp:firma.weclapp||"Nein",leadquelle:firma.leadquelle||"",potenzial:firma.potenzial||"mittel",chancenbewertung:firma.chancenbewertung||"",
    nachname:haupt.nachname||"",vorname:haupt.vorname||"",rolle:haupt.rolle||"",telefon:haupt.telefon||"",mobil:haupt.mobil||"",email:haupt.email||"",
    notes_history:historie.map(h=>({
      id:h.id,date:h.datum||"",time:h.uhrzeit||"",type:h.art||"",text:h.notiz||"",
      appointment_date:h.termin_datum||"",appointment_time:h.termin_uhrzeit||"",appointment_type:h.auto_kontaktart||"",
      auto_status:h.auto_status||"",auto_naechsterkontakt:h.auto_naechsterkontakt||"",auto_naechsterkontakt_zeit:h.termin_uhrzeit||"",auto_kontaktart:h.auto_kontaktart||""
    })),
    weitere_kontakte:weitere,attachments:anhaenge,archived:!!firma.archived
  }])[0]
}

function baseCompanyPayload(contact){
  return {
    firma:contact.firma||"",strasse:contact.strasse||"",plz:contact.plz||"",ort:contact.ort||"",bezirk:contact.bezirk||"",bundesland:contact.bundesland||"",
    kundentyp:contact.kundentyp||"",kundenstatus:contact.kundenstatus||"",status:contact.status||"",
    erstkontakt:normalizeDate(contact.erstkontakt),naechsterkontakt:normalizeDate(contact.naechsterkontakt),naechsterkontakt_zeit:contact.naechsterkontakt_zeit||"",kontaktart:contact.kontaktart||"",
    weclapp:contact.weclapp||"Nein",leadquelle:contact.leadquelle||"",potenzial:contact.potenzial||"",chancenbewertung:contact.chancenbewertung||"",
    archived:!!contact.archived,updated_at:new Date().toISOString()
  }
}

async function loadAllFromSupabase(){
  isLoading=true;setSaveState("Lade v2-Daten aus Supabase ...");
  const [{data:firmen,error:fe},{data:ansprechpartner,error:ae},{data:historie,error:he},{data:anhaenge,error:ane}]=await Promise.all([
    supabaseClient.from("crm_firmen").select("*").order("updated_at",{ascending:false}),
    supabaseClient.from("crm_ansprechpartner").select("*").order("created_at",{ascending:true}),
    supabaseClient.from("crm_historie").select("*").order("datum",{ascending:true}),
    supabaseClient.from("crm_anhaenge").select("*").order("created_at",{ascending:false})
  ]);
  if(fe)throw fe;if(ae)throw ae;if(he)throw he;if(ane)throw ane;
  contacts=(firmen||[]).map(f=>mapDbToContact(f,ansprechpartner||[],historie||[],anhaenge||[]));
  selectedId=contacts.length?contacts[0].id:null;
  isLoading=false;
  renderAll();persistLocalBackup();setSaveState("v2-Daten in v3 geladen");
}

async function saveOneContactToSupabase(contact){
  if(!contact) return;

  let firmaId = isUuid(contact.id) ? contact.id : null;
  const payload = baseCompanyPayload(contact);

  if(firmaId){
    const {error} = await supabaseClient
      .from("crm_firmen")
      .update(payload)
      .eq("id", firmaId);

    if(error) throw error;
  }else{
    const {data,error} = await supabaseClient
      .from("crm_firmen")
      .insert(payload)
      .select()
      .single();

    if(error) throw error;

    const oldId = contact.id;
    firmaId = data.id;

    contacts = contacts.map(x =>
      x.id === oldId ? {...x, id:firmaId} : x
    );

    if(selectedId === oldId) selectedId = firmaId;

    contact = {...contact, id:firmaId};
  }

  const {error:delAn} = await supabaseClient
    .from("crm_ansprechpartner")
    .delete()
    .eq("firma_id", firmaId);

  if(delAn) throw delAn;

  const anRows = [];

  if([contact.vorname, contact.nachname, contact.rolle, contact.telefon, contact.mobil, contact.email]
    .some(v => String(v || "").trim() !== "")){
    anRows.push({
      firma_id:firmaId,
      vorname:contact.vorname || "",
      nachname:contact.nachname || "",
      rolle:contact.rolle || "",
      telefon:contact.telefon || "",
      mobil:contact.mobil || "",
      email:contact.email || "",
      hauptkontakt:true
    });
  }

  (contact.weitere_kontakte || []).forEach(p => {
    if(![p.vorname, p.nachname, p.position, p.telefon, p.mobil, p.email, p.notiz]
      .some(v => String(v || "").trim() !== "")) return;

    anRows.push({
      firma_id:firmaId,
      vorname:p.vorname || "",
      nachname:p.nachname || "",
      rolle:p.position || "",
      telefon:p.telefon || "",
      mobil:p.mobil || "",
      email:p.email || "",
      hauptkontakt:false
    });
  });

  if(anRows.length){
    const {error} = await supabaseClient
      .from("crm_ansprechpartner")
      .insert(anRows);

    if(error) throw error;
  }
}

async function saveCurrentContact(){
  const c=getSelected();if(!c){alert("Bitte Kontakt auswählen.");return}
  try{syncFormToSelected();setSaveState("Speichere Kontakt ...");await saveOneContactToSupabase(getSelected());persistLocalBackup();renderAll();setSaveState("Gespeichert")}catch(e){console.error(e);setSaveState("Speichern fehlgeschlagen",true);alert("Speichern fehlgeschlagen: "+(e.message||""))}
}
async function autosaveSelectedToSupabase(){
  const c = getSelected();

  if(!c || isLoading) return;

  try{
    if($("firma")) {
      syncFormToSelected();
    }

    setSaveState("Autosave ...");

    await saveOneContactToSupabase(getSelected());

    persistLocalBackup();

    setSaveState("Automatisch gespeichert");

    renderList();
    renderPanels();

  }catch(e){
    console.error(e);
    setSaveState("Autosave fehlgeschlagen", true);
  }
}
function scheduleAutosave(){if(isLoading)return;syncFormToSelected();renderPanels();clearTimeout(autosaveTimer);setSaveState("Änderungen vorgemerkt ...");autosaveTimer=setTimeout(()=>autosaveSelectedToSupabase(),900)}
async function loadData(){try{await loadAllFromSupabase();alert("Daten aus Supabase geladen.")}catch(e){console.error(e);setSaveState("Laden fehlgeschlagen",true);alert("Laden fehlgeschlagen: "+(e.message||""))}}

/* =========================================================
   LISTE / FILTER
========================================================= */
function filteredContacts(){
  const search=$("search").value.toLowerCase().trim();const statusFilter=$("statusFilter").value;const kt=$("kundentypFilter").value;const region=$("regionFilter").value.toLowerCase().trim();
  let arr=contacts.filter(c=>{
    if(dueFilterActive&&(!hasFutureNextContact(c)||c.naechsterkontakt!==todayStr()))return false;
    const noteTexts=(c.notes_history||[]).map(n=>`${n.type||""} ${n.text||""} ${n.appointment_date||""}`).join(" ");
    const hay=[c.firma,c.nachname,c.vorname,c.kundentyp,c.bundesland,c.bezirk,c.telefon,c.mobil,c.email,c.strasse,c.plz,c.ort,c.chancenbewertung,noteTexts].join(" ").toLowerCase();
    const sOk=search===""||hay.includes(search);
    const visibleStatus=getVisibleStatus(c);
    const stOk=statusFilter==="Alle"?!c.archived:statusFilter==="Lead"?c.kundenstatus==="Lead"&&!c.archived:statusFilter==="Ohne Status"?!c.archived&&!isInWeclapp(c)&&String(c.status||"")!=="Kein Interesse"&&!hasFutureNextContact(c):statusFilter==="Archiviert"?!!c.archived:statusFilter==="In weclapp"?isInWeclapp(c)&&!c.archived:visibleStatus===statusFilter&&!c.archived;
    const ktOk=kt==="Alle"||c.kundentyp===kt;
    const rOk=region===""||[c.plz,c.ort,c.bezirk,c.bundesland].join(" ").toLowerCase().includes(region);
    return sOk&&stOk&&ktOk&&rOk;
  });
  if(currentSort)arr.sort((a,b)=>String(a[currentSort]||"").localeCompare(String(b[currentSort]||""),"de"));
  return arr;
}
function renderList(){
  renderDueBox();
  const arr=filteredContacts();const search=$("search").value.trim();const hasFilter=search!==""||$("statusFilter").value!=="Alle"||$("kundentypFilter").value!=="Alle"||$("regionFilter").value.trim()!==""||dueFilterActive;
  let visible=arr;if(!hasFilter&&$("showRecent").checked)visible=[...arr].slice(0,12);
  if(!visible.length){$("contactList").innerHTML='<div class="empty">Keine Kontakte gefunden.</div>';return}
  $("contactList").innerHTML=visible.map(c=>{
    const name=[c.vorname,c.nachname].filter(Boolean).join(" ");const st=getVisibleStatus(c);
    return `<div class="contact-item ${selectedId===c.id?'active':''} ${isInWeclapp(c)?'in-weclapp':''}" onclick="selectContact('${c.id}')">
      <div class="row"><div class="contact-title">${esc(c.firma||"(ohne Firma)")}</div>${st?`<span class="badge ${badgeClass(st)}">${esc(st)}</span>`:""}</div>

      <div class="contact-meta">${esc([c.plz,c.ort].filter(Boolean).join(" "))} ${c.bezirk?"· "+esc(c.bezirk):""}</div>
      <div class="contact-meta">${phoneLink(c.mobil||c.telefon)||""} ${c.email?" · "+mailLink(c.email):""}</div>
      <span class="chance-badge ${chanceClass(c.chancenbewertung)}">${esc(chanceLabel(c.chancenbewertung))}</span>
    </div>`
  }).join("");
}

function applyTimelineLogic(noteType,activityDate,appointmentDate,appointmentTime,appointmentType){
  const selected=getSelected();if(isInWeclapp(selected))return;const type=String(noteType||"").toLowerCase();const appointment=String(appointmentType||"").toLowerCase();const future=appointmentDate&&new Date(appointmentDate+"T"+(appointmentTime||"23:59"))>=new Date();
  if(type.includes("erstkontakt")&&!$("erstkontakt").value)$("erstkontakt").value=activityDate||todayStr();
  if(type.includes("termin vereinbart")||appointment.includes("termin vereinbart")||appointment.includes("persönlicher termin")||appointment.includes("online-termin")){$("status").value="Termin vereinbart";$("kontaktart").value=appointmentType?appointmentType.replace(/^[^a-zA-ZÄÖÜäöüß]+\s*/,""):"Persönlicher Termin";if(future){$("naechsterkontakt").value=appointmentDate;$("naechsterkontakt_zeit").value=appointmentTime||""}return}
  if(appointment.includes("rückruf")||appointment.includes("anruf")){$("status").value="Telefonat ausgemacht";$("kontaktart").value=appointmentType?appointmentType.replace(/^[^a-zA-ZÄÖÜäöüß]+\s*/,""):"Rückruf";if(future){$("naechsterkontakt").value=appointmentDate;$("naechsterkontakt_zeit").value=appointmentTime||""}return}
  if(appointment.includes("mail nachfassen")){$("status").value="Telefonat ausgemacht";$("kontaktart").value="Mail nachfassen";if(future){$("naechsterkontakt").value=appointmentDate;$("naechsterkontakt_zeit").value=appointmentTime||""}return}
  if(type.includes("mail")||type.includes("unterlagen")||type.includes("angebot")){$("status").value="Unterlagen versendet";$("kontaktart").value="Unterlagen";return}
  if(type.includes("telefonat")||type.includes("teams")){$("status").value="Sonstiges";$("kontaktart").value=type.includes("teams")?"Teams Call":"Telefonat";return}
  $("status").value="Sonstiges";$("kontaktart").value="Sonstiges";
}

async function markNoInterest(){const c=getSelected();if(!c)return;if(!confirm(`"${c.firma||'Kontakt'}" wirklich als Kein Interesse markieren?`))return;const date=$("noteDate").value||todayStr(),time=$("noteTime").value||"",text=$("activityText").value.trim()||"Kein Interesse vermerkt.";contacts=contacts.map(x=>x.id===selectedId?{...x,status:"Kein Interesse",naechsterkontakt:"",naechsterkontakt_zeit:"",kontaktart:"Kein Interesse",notes_history:[...(x.notes_history||[]),{date,time,type:"Kein Interesse",text,auto_status:"Kein Interesse",auto_naechsterkontakt:"",auto_naechsterkontakt_zeit:"",auto_kontaktart:"Kein Interesse"}]}:x);renderContactView();renderList();renderPanels();await autosaveSelectedToSupabase()}
async function markDocumentsSent(){const c=getSelected();if(!c)return;const date=$("noteDate").value||todayStr(),time=$("noteTime").value||"";let appointmentDate=$("appointmentDate").value||addDays(date,14),appointmentTime=$("appointmentTime").value||"";const activityText=$("activityText").value.trim()||"Unterlagen wurden versendet.";const note={date,time,type:"📄 Unterlagen gesendet",text:"Aktivität: "+activityText+"\nTermin/Rückruf: Art: Nachfassen Unterlagen • Datum: "+formatDateDisplay(appointmentDate),appointment_date:appointmentDate,appointment_time:appointmentTime,appointment_type:"Nachfassen Unterlagen",auto_status:"Unterlagen versendet",auto_naechsterkontakt:appointmentDate,auto_naechsterkontakt_zeit:appointmentTime,auto_kontaktart:"Nachfassen Unterlagen"};contacts=contacts.map(x=>x.id===selectedId?{...x,status:"Unterlagen versendet",naechsterkontakt:appointmentDate,naechsterkontakt_zeit:appointmentTime,kontaktart:"Nachfassen Unterlagen",notes_history:[...(x.notes_history||[]),note]}:x);renderContactView();renderList();renderPanels();await autosaveSelectedToSupabase()}
function renderNoteHistory(){const c=getSelected(),box=$("noteHistory");if(!box||!c)return;if(!(c.notes_history||[]).length){box.innerHTML='<div class="empty">Noch keine Aktivitäten vorhanden.</div>';return}box.innerHTML=[...(c.notes_history||[])].map((n,i)=>`<div class="timeline-item"><div class="timeline-head"><div><strong>${esc(formatDateDisplay(n.date||""))}${n.time?" · "+esc(n.time):""}</strong><div class="hint">${esc(n.type||"Aktivität")}</div>${n.appointment_date?`<div class="hint">Termin: ${esc(formatDateDisplay(n.appointment_date))} ${esc(n.appointment_time||"")}</div>`:""}</div><div class="actions"><button class="light" onclick="cancelAppointmentFromNote(${i})">Termin abgesagt</button><button class="delete" onclick="removeNoteEntry(${i})">Löschen</button></div></div><div class="timeline-text mt-small">${esc(n.text||"")}</div>${n.auto_status?`<div class="ai-box mt-small">Status: ${esc(n.auto_status)} ${n.auto_naechsterkontakt?"· WV: "+esc(formatDateDisplay(n.auto_naechsterkontakt)):""}</div>`:""}</div>`).reverse().join("")}
async function removeNoteEntry(index){contacts=contacts.map(x=>{if(x.id!==selectedId)return x;const n=[...(x.notes_history||[])];n.splice(index,1);return{...x,notes_history:n}});renderContactView();renderPanels();await autosaveSelectedToSupabase()}
async function cancelAppointmentFromNote(index){const c=getSelected();if(!c)return;const notes=[...(c.notes_history||[])],note=notes[index];if(!note)return;if(!confirm("Termin wirklich als abgesagt markieren?"))return;notes[index]={...note,type:"Termin abgesagt",text:(note.text||"")+"\n\nTermin wurde abgesagt.",auto_status:"Termin abgesagt",auto_naechsterkontakt:"",auto_naechsterkontakt_zeit:"",auto_kontaktart:"Termin abgesagt"};contacts=contacts.map(x=>x.id===selectedId?{...x,status:"Termin abgesagt",naechsterkontakt:x.naechsterkontakt===note.appointment_date?"":x.naechsterkontakt,naechsterkontakt_zeit:x.naechsterkontakt===note.appointment_date?"":x.naechsterkontakt_zeit,kontaktart:"Termin abgesagt",notes_history:notes}:x);renderContactView();renderList();renderPanels();await autosaveSelectedToSupabase()}

function renderAttachments(){const c=getSelected(),list=$("attachmentList");if(!list||!c)return;const atts=c.attachments||[];if(!atts.length){list.innerHTML='<div class="empty">Noch keine Anhänge.</div>';return}list.innerHTML=atts.map((a,i)=>`<div class="attachment-item"><div><strong>${esc(a.filename||a.name||"Datei")}</strong><div class="hint">${esc(a.filetype||a.type||"Datei")} · ${esc(humanSize(a.filesize||a.size||0))}</div></div><div class="actions"><button class="light" onclick="openAttachment(${i})">Öffnen</button><button class="delete" onclick="removeAttachment(${i})">Löschen</button></div></div>`).join("")}
async function ensureSelectedHasSupabaseId(){syncFormToSelected();let c=getSelected();if(!c)throw new Error("Kein Kontakt ausgewählt");if(!isUuid(c.id)){await saveOneContactToSupabase(c);c=getSelected();renderAll()}return c.id}
async function addAttachmentsToCurrent(files){const c=getSelected();if(!c)return alert("Bitte Kontakt auswählen.");if(!files||!files.length)return;try{const firmaId=await ensureSelectedHasSupabaseId();for(const file of Array.from(files)){setSaveState("Upload: "+file.name);const safeName=file.name.normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-zA-Z0-9.\-_]/g,"_").replace(/_+/g,"_");const filePath=firmaId+"/"+Date.now()+"_"+safeName;const {error:up}=await supabaseClient.storage.from("crm-attachments").upload(filePath,file,{upsert:false});if(up)throw up;const {error:db}=await supabaseClient.from("crm_anhaenge").insert({firma_id:firmaId,filename:file.name,filepath:filePath,filetype:file.type||"Datei",filesize:file.size||0});if(db)throw db}await loadAttachmentsForCurrent();setSaveState("Datei gespeichert")}catch(e){console.error(e);setSaveState("Upload fehlgeschlagen",true);alert("Upload fehlgeschlagen: "+(e.message||""))}}
function handleAttachmentInput(e){addAttachmentsToCurrent(e.target.files);e.target.value=""}
async function loadAttachmentsForCurrent(){const c=getSelected();if(!c||!isUuid(c.id))return;const {data,error}=await supabaseClient.from("crm_anhaenge").select("*").eq("firma_id",c.id).order("created_at",{ascending:false});if(error){console.error(error);return}contacts=contacts.map(x=>x.id===c.id?{...x,attachments:data||[]}:x);renderAttachments();renderPanels();persistLocalBackup()}
async function openAttachment(i){const c=getSelected();if(!c)return;const a=(c.attachments||[])[i];if(!a)return;const {data,error}=await supabaseClient.storage.from("crm-attachments").createSignedUrl(a.filepath,60);if(error){alert("Datei konnte nicht geöffnet werden.");return}window.open(data.signedUrl,"_blank")}
async function removeAttachment(i){const c=getSelected();if(!c)return;const a=(c.attachments||[])[i];if(!a||!confirm("Anhang wirklich löschen?"))return;try{if(a.filepath)await supabaseClient.storage.from("crm-attachments").remove([a.filepath]);if(a.id){const {error}=await supabaseClient.from("crm_anhaenge").delete().eq("id",a.id);if(error)throw error}await loadAttachmentsForCurrent();setSaveState("Anhang gelöscht")}catch(e){alert("Löschen fehlgeschlagen: "+(e.message||""))}}
function setupDropzone(){const dz=$("dropzone");if(!dz)return;dz.addEventListener("dragover",e=>{e.preventDefault();dz.classList.add("dragover")});dz.addEventListener("dragleave",()=>dz.classList.remove("dragover"));dz.addEventListener("drop",e=>{e.preventDefault();dz.classList.remove("dragover");if(e.dataTransfer?.files?.length)addAttachmentsToCurrent(e.dataTransfer.files)})}

========================================================= */
function newContact(){syncFormToSelected();const id=Date.now().toString();contacts.unshift({id,firma:"",nachname:"",vorname:"",rolle:"",kundentyp:"Fachpartner",kundenstatus:"Lead",bundesland:"Oberösterreich",bezirk:"",telefon:"",mobil:"",email:"",strasse:"",plz:"",ort:"",status:"Sonstiges",erstkontakt:"",naechsterkontakt:"",naechsterkontakt_zeit:"",kontaktart:"",weclapp:"Nein",leadquelle:"",potenzial:"mittel",chancenbewertung:"",notes_history:[],attachments:[],weitere_kontakte:[],archived:false});selectedId=id;renderAll();scheduleAutosave()}
function duplicateContact(){const c=getSelected();if(!c)return alert("Bitte Kontakt auswählen.");const copy=JSON.parse(JSON.stringify(c));copy.id=Date.now().toString();copy.firma=(copy.firma||"")+" Kopie";copy.attachments=[];contacts.unshift(copy);selectedId=copy.id;renderAll();scheduleAutosave()}
async function deleteCurrent(){const c=getSelected();if(!c)return;if(!confirm(`Kontakt "${c.firma||c.id}" wirklich löschen?`))return;try{if(isUuid(c.id)){const {error}=await supabaseClient.from("crm_firmen").delete().eq("id",c.id);if(error)throw error}contacts=contacts.filter(x=>x.id!==c.id);selectedId=contacts.length?contacts[0].id:null;renderAll();persistLocalBackup();setSaveState("Kontakt gelöscht")}catch(e){alert("Löschen fehlgeschlagen: "+(e.message||""))}}
async function markFollowupToday(){const c=getSelected();if(!c)return;contacts=contacts.map(x=>x.id===selectedId?{...x,naechsterkontakt:todayStr(),status:x.status||"Telefonat ausgemacht",kontaktart:x.kontaktart||"Nachfassen"}:x);renderAll();await autosaveSelectedToSupabase()}

async function saveNewHistoryNote(note){
  const c = getSelected();
  if(!c) return;

  const firmaId = await ensureSelectedHasSupabaseId();

  const {error} = await supabaseClient.from("crm_historie").insert({
    firma_id: firmaId,
    datum: normalizeDate(note.date),
    uhrzeit: normalizeTime(note.time),
    art: note.type || "",
    notiz: note.text || "",
    termin_datum: normalizeDate(note.appointment_date || note.auto_naechsterkontakt),
    termin_uhrzeit: normalizeTime(note.appointment_time || note.auto_naechsterkontakt_zeit),
    auto_status: note.auto_status || "",
    auto_naechsterkontakt: normalizeDate(note.auto_naechsterkontakt),
    auto_kontaktart: note.auto_kontaktart || ""
  });

  if(error) throw error;
}

function renderAll(){
  renderList();
  renderContactView();
  renderPanels();
}

async function initApp(){
  try{await loadAllFromSupabase()}catch(e){console.warn(e);try{const saved=JSON.parse(localStorage.getItem(STORAGE_KEY)||"{}");contacts=sanitizeContacts(saved.contacts||[]);selectedId=contacts.length?contacts[0].id:null;renderAll();setSaveState("Lokale Sicherung geladen",true)}catch(_){contacts=[];selectedId=null;renderAll();setSaveState("Keine Daten vorhanden",true)}}
}
document.getElementById("csvInput").addEventListener("change", function(e){
  const file = e.target.files[0];
  if(!file) return;

  const reader = new FileReader();

  reader.onload = function(evt){
    const text = evt.target.result;
    const lines = text.split(/\r?\n/).filter(l => l.trim() !== "");

    if(lines.length < 2){
      alert("CSV enthält keine Daten.");
      return;
    }

    const headers = lines[0].split(";").map(h => h.trim().toLowerCase());

    function col(name){
      return headers.indexOf(name.toLowerCase());
    }

    const imported = [];

    for(let i=1;i<lines.length;i++){
      const row = lines[i].split(";");

      imported.push({
        id: String(Date.now()+i),
        firma: row[col("firma")] || "",
        nachname: row[col("nachname")] || "",
        vorname: row[col("vorname")] || "",
        telefon: row[col("telefon")] || "",
        mobil: row[col("mobil")] || "",
        email: row[col("e-mail")] || row[col("email")] || "",
        strasse: row[col("straße")] || row[col("strasse")] || "",
        plz: row[col("plz")] || "",
        ort: row[col("ort")] || "",
        bezirk: row[col("bezirk")] || "",
        bundesland: row[col("bundesland")] || "Oberösterreich",
        kundentyp: row[col("kundentyp")] || "Fachpartner",
        kundenstatus: row[col("kundenstatus")] || "Lead",
        status: row[col("status")] || "Sonstiges",
        weclapp: "Nein",
        leadquelle: "CSV Import",
        potenzial: "mittel",
        chancenbewertung: "",
        notes_history: [],
        attachments: [],
        weitere_kontakte: [],
        archived: false
      });
    }

    contacts = [...imported, ...contacts];
    selectedId = contacts[0]?.id || null;

    renderAll();
persistLocalBackup();

if(confirm(imported.length + " Kontakte aus CSV geladen. Jetzt alle in Supabase speichern?")){
  saveImportedContacts(imported);
} else {
  alert("CSV wurde lokal geladen. Nicht vergessen später zu speichern.");
}
  };

  reader.readAsText(file, "UTF-8");
  e.target.value = "";
});
async function saveImportedContacts(imported){
  try{
    setSaveState("Speichere CSV Kontakte in Supabase ...");

    for(const contact of imported){
      await saveOneContactToSupabase(contact);
    }

    await loadAllFromSupabase();
    setSaveState("CSV Import in Supabase gespeichert");
    alert(imported.length + " Kontakte wurden in Supabase gespeichert.");
  }catch(e){
    console.error(e);
    setSaveState("CSV Speichern fehlgeschlagen", true);
    alert("CSV Kontakte konnten nicht vollständig gespeichert werden: " + (e.message || ""));
  }
}
initApp();
</script>
